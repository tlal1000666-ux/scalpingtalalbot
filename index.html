<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scalping Talal Bot — Trading Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b0a; --bg-2:#0a0f0e;
    --panel:#0e1513; --panel-2:#121b18; --panel-3:#16211d;
    --line:#1c2823; --line-soft:#16211d;
    --text:#e7f2ec; --dim:#7d938a; --faint:#4d5f57;
    --green:#3ddc84; --green-dim:#123322;
    --red:#ff5c5c; --red-dim:#3a1c1c;
    --amber:#f0b849; --amber-dim:#3a2f16;
    --info:#5b8def; --violet:#a78bfa;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --sans:'IBM Plex Sans Arabic','Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
  body{
    background-image:
      radial-gradient(circle at 12% -5%,rgba(61,220,132,.06),transparent 42%),
      radial-gradient(circle at 92% 8%,rgba(91,141,239,.05),transparent 40%),
      radial-gradient(circle at 80% 100%,rgba(167,139,250,.04),transparent 45%);
    padding:0 0 60px;
  }
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .ltr{direction:ltr;text-align:right}
  .pos{color:var(--green)} .neg{color:var(--red)} .amberc{color:var(--amber)}
  a{color:var(--dim)}
  ::-webkit-scrollbar{height:7px;width:7px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
  .no-sb::-webkit-scrollbar{display:none}
  .no-sb{-ms-overflow-style:none;scrollbar-width:none}

  /* ===== Layout ===== */
  .wrap{max-width:1500px;margin:0 auto;padding:0 14px}
  @media(min-width:768px){.wrap{padding:0 22px}}

  /* ===== Top bar ===== */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(7,11,10,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
  .brand{display:flex;align-items:center;gap:11px}
  .brand-logo{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(61,220,132,.25),rgba(61,220,132,.05));box-shadow:inset 0 0 0 1px rgba(61,220,132,.3);font-size:19px}
  .brand-title{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.3px}
  .brand-sub{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:1px}
  .status-cluster{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
  .chip{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;color:var(--dim);
    background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:9px;white-space:nowrap}
  .chip .dot{width:6px;height:6px;border-radius:50%}
  .dot-g{background:var(--green);box-shadow:0 0 7px var(--green)}
  .dot-r{background:var(--red);box-shadow:0 0 7px var(--red)}
  .dot-a{background:var(--amber);box-shadow:0 0 7px var(--amber)}
  .live-pill{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--green);
    background:var(--green-dim);border:1px solid rgba(61,220,132,.35);padding:6px 12px;border-radius:20px}
  .live-dot{position:relative;width:7px;height:7px}
  .live-dot i{position:absolute;inset:0;border-radius:50%;background:var(--green)}
  .live-dot i:first-child{animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{0%{transform:scale(.8);opacity:.7}80%,100%{transform:scale(2.6);opacity:0}}
  .chip-hide-sm{display:none}
  @media(min-width:900px){.chip-hide-sm{display:flex}}

  /* offline banner */
  .banner{display:none;align-items:center;gap:9px;background:var(--red-dim);border:1px solid rgba(255,92,92,.35);
    color:#ffb3b3;font-size:12.5px;padding:10px 14px;border-radius:11px;margin:14px 0}
  .banner.show{display:flex}

  /* ===== Section header ===== */
  .sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}
  .sec-t{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700}
  .sec-t .ic{font-size:16px}
  .count{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--panel-2);border:1px solid var(--line);padding:2px 9px;border-radius:20px}

  /* ===== KPI grid ===== */
  .kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:640px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:1100px){.kpi-grid{grid-template-columns:repeat(6,1fr)}}
  .kpi{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(18,27,24,.9),rgba(10,15,14,.7));
    border:1px solid var(--line);border-radius:15px;padding:14px 14px 12px;transition:border-color .2s,transform .2s}
  .kpi:hover{border-color:#2a3a33;transform:translateY(-2px)}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .kpi-label{font-size:11px;color:var(--dim)}
  .kpi-ic{font-size:14px;opacity:.7}
  .kpi-val{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1;letter-spacing:-.5px}
  .kpi-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;min-height:16px}
  .kpi-delta{font-family:var(--mono);font-size:10.5px;font-weight:600;display:flex;align-items:center;gap:2px}
  .kpi-delta .lbl{color:var(--faint);font-weight:400;margin-right:3px}
  .kpi-spark{width:60px;height:26px;opacity:.85}
  .glow-g{box-shadow:0 0 0 1px rgba(61,220,132,.22),0 0 26px -8px rgba(61,220,132,.4)}
  .tglow{text-shadow:0 0 16px rgba(61,220,132,.45)}

  /* ===== Panel ===== */
  .panel{background:rgba(14,21,19,.7);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:16px}
  @media(min-width:768px){.panel{padding:18px}}

  /* ===== Equity ===== */
  .eq-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .eq-val{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:-1px}
  .eq-meta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .badge{font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid}
  .badge-g{color:var(--green);background:rgba(61,220,132,.1);border-color:rgba(61,220,132,.3)}
  .badge-r{color:var(--red);background:rgba(255,92,92,.1);border-color:rgba(255,92,92,.3)}
  .badge-v{color:var(--violet);background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.3)}
  .badge-a{color:var(--amber);background:rgba(240,184,73,.1);border-color:rgba(240,184,73,.3)}
  .badge-n{color:var(--dim);background:var(--panel-2);border-color:var(--line)}
  .badge-i{color:var(--info);background:rgba(91,141,239,.1);border-color:rgba(91,141,239,.3)}
  .seg{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px}
  .seg button{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--dim);background:none;border:none;
    padding:5px 11px;border-radius:8px;cursor:pointer;transition:.15s}
  .seg button.on{background:rgba(61,220,132,.15);color:var(--green)}
  .eq-svg{width:100%;height:230px;display:block}
  @media(max-width:640px){.eq-svg{height:180px}.eq-val{font-size:23px}}

  /* ===== 2-col grid ===== */
  .grid2{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:1000px){.grid2{grid-template-columns:2fr 1fr}}
  .grid-eq{display:grid;grid-template-columns:1fr;gap:14px}

  /* ===== Heartbeat ===== */
  .hb{display:flex;gap:4px;overflow-x:auto;padding:14px 12px;background:var(--panel);border:1px solid var(--line);border-radius:13px}
  .hb-dot{flex:0 0 auto;width:9px;height:30px;border-radius:3px;transition:transform .15s}
  .hb-dot:hover{transform:scaleY(1.15)}
  .hb-dot.tp{background:var(--green);box-shadow:0 0 7px rgba(61,220,132,.5)}
  .hb-dot.sl{background:var(--red);box-shadow:0 0 7px rgba(255,92,92,.45)}
  .hb-dot.to{background:var(--amber);opacity:.8}
  .hb-dot.open{background:transparent;border:1.5px dashed var(--dim);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ===== Position cards ===== */
  .pos-grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:700px){.pos-grid{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:1200px){.pos-grid{grid-template-columns:repeat(3,1fr)}}
  .pcard{position:relative;text-align:right;width:100%;cursor:pointer;background:rgba(14,21,19,.72);
    border:1px solid var(--line);border-right:3px solid var(--amber);border-radius:15px;padding:15px;transition:.2s}
  .pcard:hover{border-color:rgba(61,220,132,.3);transform:translateY(-2px)}
  .pcard-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
  .p-sym{font-family:var(--mono);font-weight:700;font-size:15px}
  .p-pnl{font-family:var(--mono);font-weight:700;font-size:19px;display:flex;align-items:center;gap:4px}
  .p-pnl-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
  .p-roi{font-family:var(--mono);font-size:12px;font-weight:600}
  .bar{position:relative;height:6px;border-radius:5px;background:var(--line-soft);margin:11px 0 6px}
  .bar-fill{position:absolute;inset:0;border-radius:5px;opacity:.5}
  .bar-mk{position:absolute;top:-3px;width:2px;height:12px;border-radius:2px;background:var(--dim)}
  .bar-cur{position:absolute;top:-4px;width:3px;height:14px;border-radius:3px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8);transition:right .4s}
  .p-range{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;margin-bottom:11px}
  .p-fields{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px}
  .fld{direction:ltr;text-align:right}
  .fld-l{font-size:10px;color:var(--faint);margin-bottom:2px}
  .fld-v{font-family:var(--mono);font-size:12.5px}
  .full{grid-column:1/-1}

  /* ===== Activity feed ===== */
  .feed{display:flex;flex-direction:column;gap:7px;max-height:430px;overflow-y:auto;padding-left:4px}
  .fitem{display:flex;align-items:center;gap:11px;background:rgba(14,21,19,.5);border:1px solid var(--line-soft);border-radius:11px;padding:9px 11px;animation:slidein .35s ease}
  @keyframes slidein{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  .fic{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px}
  .fmid{flex:1;min-width:0}
  .fmid .m{font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}
  .fmid .m .s{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .fmid .tm{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:1px}
  .fdet{font-family:var(--mono);font-size:11.5px;font-weight:600;flex:0 0 auto}

  /* ===== Shadow ===== */
  .shadow-note{font-size:11.5px;color:var(--faint);line-height:1.6;margin-bottom:12px}
  .kpi.sh{border-color:rgba(167,139,250,.22)}
  .kpi.sh .kpi-label{color:var(--violet)}

  /* ===== Filters + table ===== */
  .filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
  .fbtn{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--dim);background:var(--panel-2);
    border:1px solid var(--line);padding:7px 13px;border-radius:20px;white-space:nowrap;cursor:pointer;transition:.15s}
  .fbtn.on{background:rgba(61,220,132,.1);color:var(--green);border-color:rgba(61,220,132,.4)}
  .search{position:relative}
  .search input{font-family:var(--mono);font-size:12px;color:var(--text);background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px 8px 32px;width:100%;outline:none;transition:.15s}
  @media(min-width:640px){.search input{width:200px}}
  .search input:focus{border-color:rgba(61,220,132,.4)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}

  .trow{display:flex;align-items:center;gap:11px;background:rgba(14,21,19,.55);border:1px solid var(--line);
    border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:.15s}
  .trow:hover{background:var(--panel);border-color:#2a3a33}
  .tic{flex:0 0 auto;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
  .tic.tp{background:var(--green-dim);color:var(--green)} .tic.sl{background:var(--red-dim);color:var(--red)} .tic.to{background:var(--amber-dim);color:var(--amber)}
  .tmid{flex:1;min-width:0}
  .tsym{font-family:var(--mono);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px}
  .ttime{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:2px;direction:ltr}
  .tright{flex:0 0 auto;text-align:left;direction:ltr}
  .tpnl{font-family:var(--mono);font-weight:700;font-size:14px}
  .tpct{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:2px}

  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:13px;padding:30px 16px;text-align:center;color:var(--faint);font-size:12.5px}
  .loading{text-align:center;padding:70px 20px;color:var(--faint);font-size:13.5px}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;margin:0 auto 16px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ===== Modal ===== */
  .overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);display:none;
    align-items:center;justify-content:center;padding:14px;animation:fade .2s ease}
  .overlay.show{display:flex}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{width:100%;max-width:760px;max-height:92vh;overflow-y:auto;background:var(--bg-2);border:1px solid var(--line);
    border-radius:18px;padding:18px;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
  @media(min-width:768px){.modal{padding:24px}}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(14px)}to{opacity:1;transform:none}}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
  .mclose{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--dim);
    cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
  .mclose:hover{color:var(--text)}
  .mchart{border:1px solid var(--line);background:rgba(14,21,19,.5);border-radius:14px;padding:8px;margin-bottom:16px;position:relative;min-height:260px}
  .mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:560px){.mgrid{grid-template-columns:repeat(4,1fr)}}
  .mcell{background:rgba(14,21,19,.55);border:1px solid var(--line);border-radius:12px;padding:11px 12px;direction:ltr}
  .mcell .l{font-size:10.5px;color:var(--faint)}
  .mcell .v{font-family:var(--mono);font-size:15px;font-weight:600;margin-top:3px}

  footer{margin-top:34px;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--faint);line-height:1.8}

  /* number transition helper */
  .flash-g{animation:fg .8s ease} .flash-r{animation:fr .8s ease}
  @keyframes fg{0%{color:var(--green);text-shadow:0 0 12px rgba(61,220,132,.6)}} 
  @keyframes fr{0%{color:var(--red);text-shadow:0 0 12px rgba(255,92,92,.6)}}
</style>
</head>
<body>

<!-- ============ TOP BAR ============ -->
<div class="topbar">
  <div class="wrap">
    <div class="topbar-in">
      <div class="brand">
        <div class="brand-logo">📈</div>
        <div>
          <div class="brand-title">Scalping Talal Bot</div>
          <div class="brand-sub">BINANCE · SPOT</div>
        </div>
      </div>
      <div class="status-cluster">
        <div class="chip chip-hide-sm"><span id="ws-dot" class="dot dot-g"></span>WebSocket</div>
        <div class="chip chip-hide-sm"><span id="api-dot" class="dot dot-g"></span>Binance API</div>
        <div class="chip"><span id="upd-txt">آخر تحديث: --</span></div>
        <div class="live-pill"><span class="live-dot"><i></i><i></i></span>LIVE</div>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="banner" class="banner">⚠️ تعذّر الاتصال بمصدر البيانات — سنعيد المحاولة تلقائيًا…</div>
  <div id="app">
    <div class="loading"><div class="spin"></div>جارِ تحميل بيانات البوت…</div>
  </div>
  <footer>
    يقرأ مباشرة من <span class="mono">state.json</span> · <span class="mono">trades_log.csv</span> · تحديث تلقائي كل 15 ثانية
  </footer>
</div>

<!-- ============ MODAL ============ -->
<div id="overlay" class="overlay"><div id="modal" class="modal"></div></div>

<script>
/* ============================================================
   CONFIG — نفس منطق بوتك الأصلي بالضبط (مسارات نسبية + cache-bust)
   ============================================================ */
const INITIAL_CAPITAL = 10000;
const REFRESH_MS = 15000;
function STATE_URL(){ return "./state.json?_=" + Date.now(); }
function TRADES_URL(){ return "./trades_log.csv?_=" + Date.now(); }
function SHADOW_TRADES_URL(){ return "./shadow_trades_log.csv?_=" + Date.now(); }

const app = document.getElementById('app');
const bannerEl = document.getElementById('banner');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');

/* ============ STATE (للواجهة فقط، لا يمس بياناتك) ============ */
let LAST = { state:null, trades:[], shadow:[], prices:{} };
let UI = { period:'ALL', filter:'all', search:'', openModal:null };
let prevVals = {};   // لتأثير الأرقام المتحركة
let firstLoad = true;

/* ============ HELPERS ============ */
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v){ const n=parseFloat(v); return isNaN(n)?null:n; }
function money(n,d=2){ if(n==null||isNaN(n))return '--'; const s=n<0?'-':''; return s+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function moneyS(n,d=2){ if(n==null||isNaN(n))return '--'; const s=n>0?'+':n<0?'-':''; return s+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function pctS(n,d=2){ if(n==null||isNaN(n))return '--'; const s=n>0?'+':''; return s+n.toFixed(d)+'%'; }
function price(n){ if(n==null||isNaN(n))return '--'; if(n>=100)return n.toFixed(2); if(n>=1)return n.toFixed(4); return n.toFixed(6); }
function fmtDT(iso){ if(!iso)return '--'; const d=new Date(iso); if(isNaN(d))return String(iso); const p=x=>String(x).padStart(2,'0'); return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function timeAgo(ts){ if(!ts)return '--'; const s=Math.floor((Date.now()-ts)/1000); if(s<5)return 'الآن'; if(s<60)return s+' ث'; const m=Math.floor(s/60); if(m<60)return m+' د'; const h=Math.floor(m/60); if(h<24)return h+' س'; return Math.floor(h/24)+' يوم'; }
function durFrom(iso){ if(!iso)return '--'; const t=new Date(iso).getTime(); if(isNaN(t))return '--'; let m=Math.floor((Date.now()-t)/60000); if(m<0)m=0; const h=Math.floor(m/60); const mm=m%60; return `${String(h).padStart(2,'0')}س ${String(mm).padStart(2,'0')}د`; }
function durBetween(a,b){ const t1=new Date(a).getTime(), t2=new Date(b).getTime(); if(isNaN(t1)||isNaN(t2))return '--'; let m=Math.round((t2-t1)/60000); if(m<0)m=0; const h=Math.floor(m/60); return h>0?`${h}س ${m%60}د`:`${m%60}د`; }

/* ============ BINANCE (نفس منطقك) ============ */
async function fetchBinancePrices(symbols){
  const prices={};
  await Promise.all(symbols.map(async sym=>{
    try{
      const res=await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${encodeURIComponent(sym)}`);
      if(!res.ok)return; const data=await res.json(); const p=parseFloat(data.price);
      if(!isNaN(p))prices[sym]=p;
    }catch(e){}
  }));
  return prices;
}
async function fetchKlines(sym){
  try{
    const res=await fetch(`https://api.binance.com/api/v3/klines?symbol=${encodeURIComponent(sym)}&interval=5m&limit=100`);
    if(!res.ok)return null; const d=await res.json();
    return d.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]}));
  }catch(e){return null;}
}

/* ============ CSV (نفس أعمدة بوتك) ============ */
function parseCSV(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const rows=[];
  for(const line of lines){
    const p=line.split(',');
    if(p.length<8)continue;
    rows.push({
      symbol:p[0], signal_time:p[1], signal_price:p[2], exit_time:p[3], exit_price:p[4],
      pnl_pct:parseFloat(p[5]), pnl_dollars:parseFloat(p[6]),
      exit_reason:(p[7]||'').trim(), score:p[8], balance:p[9]
    });
  }
  return rows.reverse(); // الأحدث أولًا
}
function reasonKey(r){ r=(r||'').toLowerCase(); if(r.includes('tp'))return 'tp'; if(r.includes('sl'))return 'sl'; return 'to'; }
function reasonIcon(k){ return k==='tp'?'▲':k==='sl'?'▼':'●'; }
function reasonLabel(k){ return k==='tp'?'هدف':k==='sl'?'وقف':'انتهاء'; }

/* ============ POSITION FIELD READERS (مرن مع أي تسمية) ============ */
function posEntry(p){ return num(p.entry_price)??num(p.entry)??num(p.signal_price); }
function posSL(p){ return num(p.sl)??num(p.stop_loss)??num(p.stoploss); }
function posTP(p){ return num(p.tp)??num(p.take_profit)??num(p.takeprofit); }
function posSize(p){ return num(p.position_dollars)??num(p.size_dollars)??num(p.position_size)??num(p.size); }
function posTime(p){ return p.signal_time||p.open_time||p.entry_time||p.time; }
function posScore(p){ return p.score!=null?p.score:null; }
function posStrat(p){ return p.strategy||p.strategy_name||p.setup||''; }

/* ============ STATS ============ */
function buildEquity(closed){
  // closed = الأحدث أولًا → نعكس ليصير زمنيًا
  const chrono=[...closed].reverse();
  const pts=[]; let cum=INITIAL_CAPITAL;
  pts.push(INITIAL_CAPITAL);
  for(const t of chrono){
    const bal=num(t.balance);
    if(bal!=null){ cum=bal; }
    else if(!isNaN(t.pnl_dollars)){ cum+=t.pnl_dollars; }
    pts.push(cum);
  }
  return pts;
}
function maxDrawdown(series){
  let peak=-Infinity, mdd=0;
  for(const v of series){ if(v>peak)peak=v; const dd=(v-peak)/peak*100; if(dd<mdd)mdd=dd; }
  return mdd;
}
function computeStats(trades){
  const closed=trades.filter(t=>!isNaN(t.pnl_dollars));
  const wins=closed.filter(t=>t.pnl_dollars>0);
  const losses=closed.filter(t=>t.pnl_dollars<=0);
  const winRate=closed.length?wins.length/closed.length*100:0;
  const totalPnl=closed.reduce((s,t)=>s+t.pnl_dollars,0);
  const grossW=wins.reduce((s,t)=>s+t.pnl_dollars,0);
  const grossL=Math.abs(losses.reduce((s,t)=>s+t.pnl_dollars,0));
  const pf=grossL?grossW/grossL:grossW;
  const lastBal=closed.length?num(closed[0].balance):null;
  const equity=lastBal!=null?lastBal:INITIAL_CAPITAL+totalPnl;
  const roi=(totalPnl/INITIAL_CAPITAL)*100;
  const best=closed.length?Math.max(...closed.map(t=>t.pnl_dollars)):0;
  const worst=closed.length?Math.min(...closed.map(t=>t.pnl_dollars)):0;
  const avg=closed.length?totalPnl/closed.length:0;
  const eqSeries=buildEquity(closed);
  const mdd=maxDrawdown(eqSeries);
  // اليوم
  const t0=new Date(); t0.setHours(0,0,0,0);
  const todayPnl=closed.filter(t=>{const d=new Date(t.exit_time).getTime();return !isNaN(d)&&d>=t0.getTime();}).reduce((s,t)=>s+t.pnl_dollars,0);
  return {closed,wins,losses,winRate,totalPnl,pf,equity,roi,best,worst,avg,mdd,todayPnl,eqSeries,grossW,grossL,
    avgWin:wins.length?grossW/wins.length:0, avgLoss:losses.length?grossL/losses.length:0};
}

/* ============ SVG builders ============ */
function sparkSvg(series,color,h=26){
  if(!series||series.length<2)return '';
  const W=100; const min=Math.min(...series),max=Math.max(...series); const sp=(max-min)||1;
  const pts=series.map((v,i)=>[(i/(series.length-1))*W, h-2-((v-min)/sp)*(h-4)]);
  const line='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
  const id='sp'+Math.random().toString(36).slice(2,7);
  return `<svg class="kpi-spark" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${color}" stop-opacity=".28"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L${W},${h} L0,${h} Z" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function equitySvg(series){
  if(!series||series.length<2)return `<div style="color:var(--faint);font-family:var(--mono);font-size:12px;padding:60px 0;text-align:center">لا توجد بيانات كافية بعد</div>`;
  const W=800,H=230,PADX=6,PADT=12,PADB=22;
  const min=Math.min(...series),max=Math.max(...series); const sp=(max-min)||1;
  const stepX=(W-PADX*2)/(series.length-1);
  const pts=series.map((v,i)=>[PADX+i*stepX, H-PADB-((v-min)/sp)*(H-PADT-PADB)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)},${H-PADB} L${pts[0][0].toFixed(1)},${H-PADB} Z`;
  const rising=series[series.length-1]>=series[0];
  const col=rising?'#3ddc84':'#ff5c5c';
  // خط رأس المال الابتدائي
  const capY=H-PADB-((INITIAL_CAPITAL-min)/sp)*(H-PADT-PADB);
  const capLine=(INITIAL_CAPITAL>=min&&INITIAL_CAPITAL<=max)?`<line x1="${PADX}" x2="${W-PADX}" y1="${capY.toFixed(1)}" y2="${capY.toFixed(1)}" stroke="#4d5f57" stroke-dasharray="5 5" stroke-width="1"/>`:'';
  const grid=[.25,.5,.75].map(f=>`<line x1="${PADX}" x2="${W-PADX}" y1="${(PADT+f*(H-PADT-PADB)).toFixed(1)}" y2="${(PADT+f*(H-PADT-PADB)).toFixed(1)}" stroke="#16211d"/>`).join('');
  return `<svg class="eq-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="eqg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${col}" stop-opacity=".3"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${grid}${capLine}
    <path d="${area}" fill="url(#eqg)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.5" fill="${col}"/>
  </svg>`;
}
function periodSlice(series){
  const map={'7D':8,'1M':31,'3M':91,'6M':181,'1Y':366,'ALL':series.length};
  const n=map[UI.period]||series.length;
  return series.slice(Math.max(0,series.length-n));
}

/* ============ POSITION PnL ============ */
function posPnl(p,cur){
  const entry=posEntry(p), size=posSize(p), tp=posTP(p);
  if(entry==null||size==null||cur==null||entry===0)return {usd:0,pct:0,known:false};
  const isLong = tp!=null ? tp>entry : true;
  const chg = isLong ? (cur-entry)/entry : (entry-cur)/entry;
  return {usd:chg*size, pct:chg*100, known:true, isLong};
}

/* ============ RENDER ============ */
function kpiCard(label,valHtml,ic,foot,cls,key,rawVal,tone){
  let flash='';
  if(!firstLoad && key && prevVals[key]!=null && rawVal!=null && rawVal!==prevVals[key]){
    flash = rawVal>prevVals[key]?'flash-g':'flash-r';
  }
  if(key)prevVals[key]=rawVal;
  const toneCls = tone==='pos'?'pos':tone==='neg'?'neg':'';
  return `<div class="kpi ${cls||''}">
    <div class="kpi-top"><span class="kpi-label">${label}</span><span class="kpi-ic">${ic||''}</span></div>
    <div class="kpi-val ${toneCls} ${flash}">${valHtml}</div>
    <div class="kpi-foot">${foot||'<span></span>'}</div>
  </div>`;
}

    ${kpiCard('الربح العائم', floatKnown?moneyS(floating):'--', '🌊', floatKnown?`<span class="kpi-delta ${floating>=0?'pos':'neg'}">مفتوحة الآن</span>`:'<span class="kpi-delta"><span class="lbl">بانتظار السعر</span></span>', '', 'float', floating, floating>=0?'pos':'neg')}
    ${kpiCard('نسبة النجاح', st.winRate.toFixed(1)+'%', '🎯', `<span class="kpi-delta"><span class="lbl">${st.wins.length}ر / ${st.losses.length}خ</span></span>`, '', 'wr', st.winRate)}
    ${kpiCard('عامل الربح', (isFinite(st.pf)?st.pf.toFixed(2):'∞'), '⚖️', `<span class="kpi-delta"><span class="lbl">Profit Factor</span></span>`, '', 'pf', st.pf)}
    ${kpiCard('صفقات مفتوحة', String(openSyms.length), '📂', `<span class="kpi-delta"><span class="lbl">Live</span></span>`, '', 'open', openSyms.length)}

    ${kpiCard('عدد الصفقات', String(st.closed.length), '🔢', '<span></span>', '', 'nt', st.closed.length)}
    ${kpiCard('أقصى تراجع', st.mdd.toFixed(2)+'%', '📉', '<span class="kpi-delta neg">Max DD</span>', '', 'mdd', st.mdd, 'neg')}
    ${kpiCard('أفضل صفقة', moneyS(st.best), '🏆', '<span></span>', '', 'best', st.best, 'pos')}
    ${kpiCard('أسوأ صفقة', moneyS(st.worst), '⚠️', '<span></span>', '', 'wrst', st.worst, 'neg')}
    ${kpiCard('متوسط الصفقة', moneyS(st.avg), '➗', '<span></span>', '', 'avg', st.avg, st.avg>=0?'pos':'neg')}
  </div>`;

  // ===== Equity + Activity =====
  const eqSeries = periodSlice(sparkFull);
  const equitySec = `<div class="panel">
    <div class="eq-head">
      <div>
        <div class="sec-t" style="margin:0 0 8px"><span class="ic">📈</span>منحنى رأس المال</div>
        <div class="eq-meta">
          <span class="eq-val ${st.roi>=0?'pos tglow':'neg'}">${money(totalEquity)}</span>
          <span class="badge ${st.roi>=0?'badge-g':'badge-r'}">${pctS(st.roi)}</span>
          <span class="mono" style="font-size:11px;color:var(--faint)">مقابل ${money(INITIAL_CAPITAL,0)} بداية</span>

        ${['7D','1M','3M','6M','1Y','ALL'].map(p=>`<button data-p="${p}" class="${UI.period===p?'on':''}">${p}</button>`).join('')}

function heartbeat(closed, openCount){
  const hbTrades=closed.slice(0,44).reverse();
  let dots=hbTrades.map(t=>{
    const k=reasonKey(t.exit_reason);
    const cls = t.pnl_dollars>0 ? 'tp' : (k==='sl'?'sl':(k==='to'?'to':'sl'));
    return `<div class="hb-dot ${cls}" title="${esc(t.symbol)} · ${moneyS(t.pnl_dollars)}"></div>`;
  }).join('');
  for(let i=0;i<openCount;i++)dots+=`<div class="hb-dot open" title="مفتوحة"></div>`;
  return `<div class="hb no-sb">${dots||'<span style="color:var(--faint);font-family:var(--mono);font-size:11px">لا توجد صفقات بعد</span>'}</div>`;
}

function positionCard(sym,p,cur){
  const entry=posEntry(p), tp=posTP(p), sl=posSL(p), size=posSize(p), score=posScore(p), strat=posStrat(p), t=posTime(p);
  const r=posPnl(p,cur);
  const positive=r.usd>=0;
  const c = cur!=null?cur:entry;
  // شريط: من SL إلى TP
  let barCur=50,barEntry=50;
  if(sl!=null&&tp!=null){
    const lo=Math.min(sl,tp),hi=Math.max(sl,tp),span=(hi-lo)||1;
    barCur=Math.max(2,Math.min(98,((c-lo)/span)*100));
    barEntry=Math.max(2,Math.min(98,((entry-lo)/span)*100));
  }
  const tpDist = (tp!=null&&c)?((tp-c)/c*100):null;
  const slDist = (sl!=null&&c)?((sl-c)/c*100):null;
  const borderCol = positive?'var(--green)':'var(--red)';
  const side = r.isLong===false?'SELL':'BUY';
  return `<div class="pcard" data-pos="${esc(sym)}" style="border-right-color:${borderCol}">
    <div class="pcard-top">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="p-sym">${esc(sym)}</span>
        <span class="badge ${side==='BUY'?'badge-g':'badge-r'}">${side}</span>
      </div>
      ${score!=null?`<span class="badge badge-v">Score ${esc(String(score))}</span>`:''}
    </div>
    <div class="p-pnl-row">
      <span class="p-pnl ${positive?'pos':'neg'}">${positive?'▲':'▼'} ${r.known?moneyS(r.usd):'--'}</span>
      <span class="p-roi ${positive?'pos':'neg'}">${r.known?pctS(r.pct):''}</span>
    </div>
    <div class="bar">
      <div class="bar-fill" style="background:linear-gradient(90deg,${side==='BUY'?'var(--red),var(--amber) 50%,var(--green)':'var(--green),var(--amber) 50%,var(--red)'})"></div>
      <div class="bar-mk" style="right:${100-barEntry}%"></div>
      <div class="bar-cur" style="right:calc(${100-barCur}% - 1.5px)"></div>
    </div>
    <div class="p-range">
      <span class="neg">SL ${price(sl)}</span>
      <span style="color:#fff">${price(c)}</span>
      <span class="pos">TP ${price(tp)}</span>
    </div>
    <div class="p-fields">
      <div class="fld"><div class="fld-l">الدخول</div><div class="fld-v">${price(entry)}</div></div>
      <div class="fld"><div class="fld-l">الحجم</div><div class="fld-v">${size!=null?money(size,0):'--'}</div></div>
      <div class="fld"><div class="fld-l">بُعد الهدف</div><div class="fld-v pos">${tpDist!=null?pctS(tpDist):'--'}</div></div>
      <div class="fld"><div class="fld-l">بُعد الوقف</div><div class="fld-v neg">${slDist!=null?pctS(slDist):'--'}</div></div>
      <div class="fld full"><div class="fld-l">مدة الصفقة</div><div class="fld-v">${durFrom(t)}</div></div>
    </div>
  </div>`;
}

function activityFeed(trades, openPos, prices){
  const items=[];
  // صفقات مفتوحة كأحداث حية
  Object.keys(openPos).slice(0,4).forEach(sym=>{
    const r=posPnl(openPos[sym],prices[sym]);
    items.push({t:new Date(posTime(openPos[sym])).getTime()||Date.now(),type:'open',sym,msg:'صفقة مفتوحة',
      det:r.known?moneyS(r.usd):('دخول '+price(posEntry(openPos[sym]))),pos:r.usd});
  });
  // آخر صفقات مغلقة
  trades.slice(0,16).forEach(t=>{
    const k=reasonKey(t.exit_reason);
    const type = t.pnl_dollars>0?'tp':(k==='sl'?'sl':'to');
    items.push({t:new Date(t.exit_time).getTime()||0,type,sym:t.symbol,
      msg: t.pnl_dollars>0?'تحقق ربح':(k==='sl'?'وقف خسارة':'إغلاق زمني'),
      det:moneyS(t.pnl_dollars),pos:t.pnl_dollars});
  });
  items.sort((a,b)=>b.t-a.t);
  const cfg={open:['🔵','var(--info)','rgba(91,141,239,.12)'],tp:['🎯','var(--green)','rgba(61,220,132,.12)'],
    sl:['🛑','var(--red)','rgba(255,92,92,.12)'],to:['⏱️','var(--amber)','rgba(240,184,73,.12)']};
  const rows=items.slice(0,18).map(it=>{
    const c=cfg[it.type]||cfg.open;
    const detCls = it.pos>0?'pos':it.pos<0?'neg':'';
    return `<div class="fitem">
      <div class="fic" style="background:${c[2]}">${c[0]}</div>
      <div class="fmid"><div class="m">${it.msg}<span class="s">${esc(it.sym)}</span></div><div class="tm">${it.t?timeAgo(it.t):''}</div></div>
      <div class="fdet ${detCls}">${esc(it.det)}</div>
    </div>`;
  }).join('');
  return `<div class="feed no-sb">${rows||'<div class="empty">لا يوجد نشاط بعد</div>'}</div>`;
}

function shadowSection(state,shadow){
  const closed=shadow.filter(t=>!isNaN(t.pnl_dollars));
  if(!state && closed.length===0) return '';
  const wins=closed.filter(t=>t.pnl_dollars>0);
  const wr=closed.length?wins.length/closed.length*100:0;
  const total=closed.reduce((s,t)=>s+t.pnl_dollars,0);
  const roi=total/INITIAL_CAPITAL*100;
  const openN=state&&state.shadow_open_positions?Object.keys(state.shadow_open_positions).length:0;
  const pendN=state&&state.shadow_pending_setups?Object.keys(state.shadow_pending_setups).length:0;
  const bal=state&&state.shadow_balance!=null?state.shadow_balance:(INITIAL_CAPITAL+total);
  if(closed.length===0 && openN===0 && pendN===0) return '';
  return `<div class="sec"><div class="sec-t"><span class="ic">👥</span>مسار الظل <span class="badge badge-v">بدون حد للصفقات المتزامنة</span></div></div>
  <div class="shadow-note">مسار مواز يفتح كل الإشارات دون قيد على عدد الصفقات المفتوحة في نفس الوقت — لمقارنة الأداء الافتراضي مع الحقيقي.</div>
  <div class="kpi-grid">
    ${kpiCard('رأس مال الظل', money(bal), '🟣', '<span></span>', 'sh', 'shbal', bal)}
    ${kpiCard('ربح الظل', moneyS(total), '🟣', `<span class="kpi-delta ${total>=0?'pos':'neg'}">${pctS(roi)}</span>`, 'sh', 'shtot', total, total>=0?'pos':'neg')}
    ${kpiCard('نجاح الظل', wr.toFixed(1)+'%', '🟣', `<span class="kpi-delta"><span class="lbl">${wins.length}/${closed.length}</span></span>`, 'sh', 'shwr', wr)}
    ${kpiCard('صفقات الظل', String(closed.length), '🟣', '<span></span>', 'sh', 'shn', closed.length)}
    ${kpiCard('مفتوحة (ظل)', String(openN), '🟣', '<span></span>', 'sh', 'shopen', openN)}
    ${kpiCard('معلّقة (ظل)', String(pendN), '🟣', '<span></span>', 'sh', 'shpend', pendN)}
  </div>`;
}

function pendingSection(state){
  const pend = state&&state.pending_setups?state.pending_setups:null;
  if(!pend) return '';
  const syms=Object.keys(pend);
  if(!syms.length) return '';
  const cards=syms.map(sym=>{
    const p=pend[sym];
    return `<div class="pcard" style="border-right-color:var(--dim);cursor:default">
      <div class="pcard-top"><span class="p-sym">${esc(sym)}</span><span class="badge badge-n">معلّق</span></div>
      <div class="p-fields">
        <div class="fld"><div class="fld-l">سعر الإشارة</div><div class="fld-v">${price(posEntry(p))}</div></div>
        <div class="fld"><div class="fld-l">الهدف</div><div class="fld-v pos">${price(posTP(p))}</div></div>
        <div class="fld"><div class="fld-l">الوقف</div><div class="fld-v neg">${price(posSL(p))}</div></div>
        ${posScore(p)!=null?`<div class="fld"><div class="fld-l">Score</div><div class="fld-v">${esc(String(posScore(p)))}</div></div>`:''}
      </div>
    </div>`;
  }).join('');
  return `<div class="sec"><div class="sec-t"><span class="ic">⏳</span>إعدادات معلّقة</div><span class="count">${syms.length}</span></div><div class="pos-grid">${cards}</div>`;
}

function historySection(closed){
  let rows=[...closed];
  if(UI.filter==='win')rows=rows.filter(t=>t.pnl_dollars>0);
  else if(UI.filter==='loss')rows=rows.filter(t=>t.pnl_dollars<=0);
  else if(UI.filter==='tp')rows=rows.filter(t=>reasonKey(t.exit_reason)==='tp');
  else if(UI.filter==='sl')rows=rows.filter(t=>reasonKey(t.exit_reason)==='sl');
  else if(UI.filter==='to')rows=rows.filter(t=>reasonKey(t.exit_reason)==='to');
  if(UI.search)rows=rows.filter(t=>t.symbol.toLowerCase().includes(UI.search.toLowerCase()));
  rows=rows.slice(0,60);
  const filters=[['all','الكل'],['win','رابحة'],['loss','خاسرة'],['tp','هدف'],['sl','وقف'],['to','زمني']];
  const list=rows.map((t,i)=>{
    const k=reasonKey(t.exit_reason);
    const cls = t.pnl_dollars>0?'tp':(k==='sl'?'sl':(k==='to'?'to':'sl'));
    return `<div class="trow" data-trade="${i}">
      <div class="tic ${cls}">${reasonIcon(k)}</div>
      <div class="tmid">
        <div class="tsym">${esc(t.symbol)} <span class="badge badge-n" style="font-size:9px;padding:1px 7px">${reasonLabel(k)}</span></div>
        <div class="ttime">${fmtDT(t.exit_time)}</div>
      </div>
      <div class="tright">
        <div class="tpnl ${t.pnl_dollars>=0?'pos':'neg'}">${moneyS(t.pnl_dollars)}</div>
        <div class="tpct ${t.pnl_dollars>=0?'pos':'neg'}">${pctS(t.pnl_pct)}</div>
      </div>
    </div>`;
  }).join('');
  window.__histRows=rows; // للنقر → تفاصيل
  return `<div class="sec"><div class="sec-t"><span class="ic">📜</span>سجل الصفقات</div><span class="count">${closed.length}</span></div>
  <div class="panel">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="filters no-sb" id="hist-filters">
        ${filters.map(f=>`<button class="fbtn ${UI.filter===f[0]?'on':''}" data-f="${f[0]}">${f[1]}</button>`).join('')}
      </div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4-4"/></svg>
        <input id="hist-search" placeholder="ابحث بالعملة…" value="${esc(UI.search)}">
      </div>
    </div>
    <div>${list||'<div class="empty">لا توجد صفقات مطابقة</div>'}</div>
  </div>`;
}

/* ============ EVENTS ============ */
function bindEvents(){
  document.querySelectorAll('#period-seg button').forEach(b=>b.onclick=()=>{UI.period=b.dataset.p;render();});
  document.querySelectorAll('#hist-filters .fbtn').forEach(b=>b.onclick=()=>{UI.filter=b.dataset.f;render();});
  const s=document.getElementById('hist-search');
  if(s){ s.oninput=()=>{UI.search=s.value; render(); const ns=document.getElementById('hist-search'); if(ns){ns.focus(); ns.setSelectionRange(ns.value.length,ns.value.length);} }; }
  document.querySelectorAll('[data-pos]').forEach(el=>el.onclick=()=>openPositionModal(el.dataset.pos));
  document.querySelectorAll('[data-trade]').forEach(el=>el.onclick=()=>openTradeModal(+el.dataset.trade));
}
overlay.onclick=e=>{ if(e.target===overlay)closeModal(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });
function closeModal(){ overlay.classList.remove('show'); UI.openModal=null; }

/* ============ MODALS ============ */
async function openPositionModal(sym){

  const r=posPnl(p,cur), positive=r.usd>=0;
  const side=r.isLong===false?'SELL':'BUY';
  const tpDist=(tp!=null&&cur)?((tp-cur)/cur*100):null;
  const slDist=(sl!=null&&cur)?((sl-cur)/cur*100):null;

  modal.innerHTML=`
    <div class="modal-head">
      <div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-family:var(--mono);font-size:20px;font-weight:700">${esc(sym)}</span>
          <span class="badge ${side==='BUY'?'badge-g':'badge-r'}">${side}</span>

        </div>

      </div>
      <button class="mclose" onclick="closeModal()">✕</button>
    </div>
    <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:14px">
      <span class="${positive?'pos tglow':'neg'}" style="font-family:var(--mono);font-size:30px;font-weight:700">${r.known?moneyS(r.usd):'--'}</span>
      <span class="${positive?'pos':'neg'}" style="font-family:var(--mono);font-size:15px;font-weight:600">${r.known?pctS(r.pct):''}</span>
    </div>
    <div class="mchart" id="mchart"><div class="loading" style="padding:90px 0"><div class="spin"></div>جارِ تحميل الشارت…</div></div>
    <div class="mgrid">
      <div class="mcell"><div class="l">الدخول</div><div class="v">${price(entry)}</div></div>
      <div class="mcell"><div class="l">السعر الحالي</div><div class="v ${positive?'pos':'neg'}">${price(cur)}</div></div>
      <div class="mcell"><div class="l">بُعد الهدف</div><div class="v pos">${tpDist!=null?pctS(tpDist):'--'}</div></div>
      <div class="mcell"><div class="l">بُعد الوقف</div><div class="v neg">${slDist!=null?pctS(slDist):'--'}</div></div>
      <div class="mcell"><div class="l">الربح العائم</div><div class="v ${positive?'pos':'neg'}">${r.known?moneyS(r.usd):'--'}</div></div>
      <div class="mcell"><div class="l">العائد</div><div class="v ${positive?'pos':'neg'}">${r.known?pctS(r.pct):'--'}</div></div>
      <div class="mcell"><div class="l">المخاطرة/العائد</div><div class="v">${rr!=null?'1 : '+rr.toFixed(2):'--'}</div></div>
      <div class="mcell"><div class="l">حجم الصفقة</div><div class="v">${size!=null?money(size,0):'--'}</div></div>
    </div>`;
  overlay.classList.add('show');
  const kl=await fetchKlines(sym);
  const el=document.getElementById('mchart');
  if(el) el.innerHTML = kl?candleSvg(kl,[
    {p:entry,c:'#5b8def',l:'دخول'},{p:tp,c:'#3ddc84',l:'TP'},{p:sl,c:'#ff5c5c',l:'SL'}
  ],cur):'<div class="empty" style="margin:60px 0">تعذّر تحميل بيانات الشارت</div>';
}

    ]):'<div class="empty" style="margin:60px 0">تعذّر تحميل بيانات الشارت</div>';
  });
}

function candleSvg(candles,lines,live){
  const W=800,H=260,PT=12,PB=22,PR=58;
  const chartH=H-PT-PB, chartW=W-PR;
  const all=[...candles.flatMap(c=>[c.h,c.l]),...lines.filter(l=>l.p!=null).map(l=>l.p)];
  if(live!=null)all.push(live);
  const min=Math.min(...all),max=Math.max(...all),sp=(max-min)||1,pad=sp*.08,lo=min-pad,hi=max+pad,rng=hi-lo;
  const y=p=>PT+chartH-((p-lo)/rng)*chartH;
  const cw=chartW/candles.length, bw=Math.max(1.4,cw*.6);
  let out=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:260px;display:block">`;
  [0,.25,.5,.75,1].forEach(f=>out+=`<line x1="0" x2="${chartW}" y1="${PT+f*chartH}" y2="${PT+f*chartH}" stroke="#16211d"/>`);
  // مناطق TP/SL
  const eL=lines.find(l=>l.l==='دخول'), tL=lines.find(l=>l.l==='TP'), sL=lines.find(l=>l.l==='SL');
  if(eL&&tL&&eL.p!=null&&tL.p!=null)out+=`<rect x="0" y="${Math.min(y(eL.p),y(tL.p))}" width="${chartW}" height="${Math.abs(y(tL.p)-y(eL.p))}" fill="#3ddc84" opacity=".05"/>`;
  if(eL&&sL&&eL.p!=null&&sL.p!=null)out+=`<rect x="0" y="${Math.min(y(eL.p),y(sL.p))}" width="${chartW}" height="${Math.abs(y(sL.p)-y(eL.p))}" fill="#ff5c5c" opacity=".05"/>`;
  candles.forEach((c,i)=>{
    const x=i*cw+cw/2, up=c.c>=c.o, col=up?'#3ddc84':'#ff5c5c';
    out+=`<line x1="${x}" x2="${x}" y1="${y(c.h)}" y2="${y(c.l)}" stroke="${col}" stroke-width="1" opacity=".85"/>`;
    out+=`<rect x="${x-bw/2}" y="${Math.min(y(c.o),y(c.c))}" width="${bw}" height="${Math.max(1,Math.abs(y(c.c)-y(c.o)))}" fill="${col}" opacity=".9"/>`;
  });
  lines.forEach(l=>{ if(l.p==null)return;
    out+=`<line x1="0" x2="${chartW}" y1="${y(l.p)}" y2="${y(l.p)}" stroke="${l.c}" stroke-width="1.2" ${l.dash?'stroke-dasharray="5 4"':''} opacity=".85"/>`;
    out+=`<rect x="${chartW+2}" y="${y(l.p)-8}" width="${PR-4}" height="16" rx="3" fill="${l.c}" opacity=".16"/>`;
    out+=`<text x="${chartW+6}" y="${y(l.p)+3.5}" fill="${l.c}" font-size="9" font-family="JetBrains Mono">${price(l.p)}</text>`;
    out+=`<text x="3" y="${y(l.p)-3}" fill="${l.c}" font-size="8" font-family="JetBrains Mono" opacity=".85">${l.l}</text>`;
  });
  if(live!=null){
    out+=`<circle cx="${chartW-2}" cy="${y(live)}" r="3.5" fill="#fff"><animate attributeName="opacity" values="1;.3;1" dur="1.4s" repeatCount="indefinite"/></circle>`;
    out+=`<circle cx="${chartW-2}" cy="${y(live)}" r="5" fill="none" stroke="#fff" stroke-width="1" opacity=".4"><animate attributeName="r" values="4;11;4" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0;.5" dur="1.8s" repeatCount="indefinite"/></circle>`;
  }
  return out+'</svg>';
}

/* ============ LOAD (نفس منطق بوتك) ============ */
async function load(){
  try{
    const [sR,tR,shR]=await Promise.allSettled([
      fetch(STATE_URL()).then(r=>{if(!r.ok)throw 0;return r.json();}),
      fetch(TRADES_URL()).then(r=>{if(!r.ok)throw 0;return r.text();}),
      fetch(SHADOW_TRADES_URL()).then(r=>{if(!r.ok)throw 0;return r.text();})
    ]);
    const state=sR.status==='fulfilled'?sR.value:null;
    const trades=tR.status==='fulfilled'?parseCSV(tR.value):[];
    const shadow=shR.status==='fulfilled'?parseCSV(shR.value):[];

    let prices={};
    if(state&&state.open_positions){
      const syms=Object.keys(state.open_positions);
      if(syms.length)prices=await fetchBinancePrices(syms);
    }
    const ok = state!==null || trades.length>0;
    setStatus(ok);
    if(!ok && firstLoad){ app.innerHTML=`<div class="empty" style="margin-top:20px">لم يتم العثور على بيانات بعد.<br>تأكد من وجود <span class="mono">state.json</span> و <span class="mono">trades_log.csv</span> بجانب الصفحة.</div>`; return; }
    LAST={state,trades,shadow,prices};
    render();
    // حدّث المودال المفتوح لو كان صفقة (سعر حي)
    refreshOpenModalPrice();
  }catch(err){
    setStatus(false);
    if(firstLoad)app.innerHTML=`<div class="empty" style="margin-top:20px">تعذّر تحميل البيانات.</div>`;
  }
}
function setStatus(ok){
  document.getElementById('ws-dot').className='dot '+(ok?'dot-g':'dot-r');
  document.getElementById('api-dot').className='dot '+(ok?'dot-g':'dot-r');
  document.getElementById('upd-txt').textContent='آخر تحديث: '+new Date().toLocaleTimeString('en-GB');
  bannerEl.classList.toggle('show',!ok && !firstLoad);
}
async function refreshOpenModalPrice(){

    const svg=document.querySelector('#mchart svg');
    // نكتفي بتحديث الأرقام عبر إعادة فتح خفيف
  }
}

load();
setInterval(load, REFRESH_MS);
