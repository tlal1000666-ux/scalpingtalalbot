<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scalping Talal Bot</title>
<meta name="theme-color" content="#0d1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--surface3:#21262d;
--border:#30363d;--border2:#3d444d;
--text:#e6edf3;--text2:#8b949e;--text3:#484f58;
--green:#3fb950;--green-bg:rgba(63,185,80,.1);--green-b:rgba(63,185,80,.3);
--red:#f85149;--red-bg:rgba(248,81,73,.1);--red-b:rgba(248,81,73,.3);
--blue:#58a6ff;--blue-bg:rgba(88,166,255,.1);
--purple:#bc8cff;--amber:#d29922;--amber-bg:rgba(210,153,34,.1);
--mono:'JetBrains Mono',monospace;
--sans:'IBM Plex Sans Arabic',sans-serif;
--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;line-height:1.5}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
@media(min-width:768px){.wrap{padding:24px}}
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#238636,#2ea043);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 20px rgba(46,160,67,.3)}
.brand h1{font-size:18px;font-weight:800}
.brand p{font-size:11px;color:var(--text2);font-family:var(--mono)}
.live-badge{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--green);background:var(--green-bg);border:1px solid var(--green-b);padding:5px 12px;border-radius:20px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 4px var(--green)}50%{opacity:.4;box-shadow:none}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}
@media(min-width:640px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi.g::after{background:var(--green)}.kpi.r::after{background:var(--red)}.kpi.b::after{background:var(--blue)}.kpi.a::after{background:var(--amber)}.kpi.p::after{background:var(--purple)}
.kpi-label{font-size:10px;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.kpi-val{font-family:var(--mono);font-size:20px;font-weight:700}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:4px;font-family:var(--mono)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.card-t{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-b{padding:16px 18px}
.tabs{display:flex;gap:4px;margin:20px 0 16px;overflow-x:auto;padding-bottom:4px}
.tab{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;border:1px solid transparent;background:var(--surface);transition:.15s;white-space:nowrap;font-family:var(--sans)}
.tab:hover{color:var(--text);border-color:var(--border)}
.tab.on{background:var(--green-bg);color:var(--green);border-color:var(--green-b)}
.tab .cnt{font-family:var(--mono);font-size:10px;background:var(--surface3);padding:1px 6px;border-radius:8px;margin-inline-start:4px}
.eq-wrap{position:relative;height:220px;margin:8px 0}
.eq-svg{width:100%;height:100%;display:block}
.eq-val{font-family:var(--mono);font-size:28px;font-weight:700;margin-bottom:2px}
.eq-ret{font-family:var(--mono);font-size:13px;font-weight:600}
.eq-ranges{display:flex;gap:3px;background:var(--surface3);border-radius:8px;padding:3px}
.eq-ranges button{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--text3);background:none;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;transition:.15s}
.eq-ranges button:hover{color:var(--text)}
.eq-ranges button.on{background:var(--green-bg);color:var(--green)}
.eq-tooltip{position:absolute;pointer-events:none;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:11px;opacity:0;transition:opacity .1s;z-index:10;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.eq-tooltip.show{opacity:1}
.eq-crosshair{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.25);pointer-events:none;opacity:0}
.eq-crosshair.show{opacity:1}
.eq-dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid var(--green);transform:translate(-50%,-50%);pointer-events:none;opacity:0}
.eq-dot.show{opacity:1}
.hb{display:flex;gap:3px;align-items:flex-end;height:44px;overflow-x:auto;padding:4px 0}
.hb-bar{flex:0 0 auto;width:7px;border-radius:2px;min-height:6px;transition:.15s;cursor:pointer}
.hb-bar:hover{transform:scaleY(1.3);filter:brightness(1.3)}
.hb-bar.tp{background:var(--green)}.hb-bar.trail{background:#2ea043}.hb-bar.sl{background:var(--red)}.hb-bar.to{background:var(--amber)}
.hb-bar.open{background:transparent;border:1.5px dashed var(--text3);height:20px!important;animation:pulse 1.5s infinite}
.pos-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.pos-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.pos-grid{grid-template-columns:repeat(3,1fr)}}
.pos-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:16px;transition:.2s}
.pos-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.pos-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pos-sym{font-family:var(--mono);font-size:14px;font-weight:700}
.pos-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--blue-bg);color:var(--blue);border:1px solid rgba(88,166,255,.3)}
.range-bar{position:relative;height:32px;background:var(--surface3);border-radius:6px;margin:12px 0;overflow:visible}
.range-fill{position:absolute;top:0;bottom:0;border-radius:6px}
.range-fill.profit{background:var(--green-bg);border:1px solid var(--green-b)}
.range-fill.loss{background:var(--red-bg);border:1px solid var(--red-b)}
.range-marker{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px}
.range-marker.entry{background:var(--blue)}
.range-marker.current{background:#fff;box-shadow:0 0 6px rgba(255,255,255,.5)}
.range-marker.sl{background:var(--red)}
.range-marker.tp{background:var(--green)}
.range-label{position:absolute;top:-16px;font-size:8px;font-family:var(--mono);transform:translateX(-50%);white-space:nowrap}
.pos-info{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pos-i{text-align:center}
.pos-i .l{font-size:9px;color:var(--text3)}
.pos-i .v{font-family:var(--mono);font-size:11px;font-weight:600;margin-top:1px}
.tr-row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.tr-row:last-child{border-bottom:none}
.tr-ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.tr-ic.w{background:var(--green-bg);border:1px solid var(--green-b)}
.tr-ic.l{background:var(--red-bg);border:1px solid var(--red-b)}
.tr-sym{font-family:var(--mono);font-size:12px;font-weight:600}
.tr-meta{font-size:10px;color:var(--text3);font-family:var(--mono)}
.tr-pnl{text-align:left}
.tr-pnl .v{font-family:var(--mono);font-size:13px;font-weight:700}
.tr-pnl .p{font-family:var(--mono);font-size:10px}
.feed-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.feed-item:last-child{border-bottom:none}
.feed-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.feed-dot.g{background:var(--green);box-shadow:0 0 6px var(--green)}
.feed-dot.r{background:var(--red);box-shadow:0 0 6px var(--red)}
.feed-dot.b{background:var(--blue);box-shadow:0 0 6px var(--blue)}
.feed-dot.a{background:var(--amber)}
.feed-text{font-size:12px;line-height:1.6}
.feed-time{font-size:10px;color:var(--text3);font-family:var(--mono)}
.status{position:fixed;bottom:0;left:0;right:0;background:rgba(13,17,23,.92);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--text3);z-index:99}
.st-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-inline-end:5px}
.st-dot.on{background:var(--green);box-shadow:0 0 4px var(--green)}
.st-dot.off{background:var(--red)}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px}
.hidden{display:none}
.pend-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);gap:10px}
.pend-row:last-child{border-bottom:none}
.pend-sym{font-family:var(--mono);font-size:12px;font-weight:600}
.pend-info{font-size:10px;color:var(--text2);font-family:var(--mono)}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">
      <div class="logo">📈</div>
      <div><h1>Scalping Talal Bot</h1><p>BINANCE · SPOT · 30m · BOS+OB</p></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="live-badge"><span class="live-dot"></span> LIVE</div>
      <span class="mono" style="font-size:10px;color:var(--text3)" id="upd">--</span>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs">
    <div class="tab on" data-t="overview">📊 نظرة عامة</div>
    <div class="tab" data-t="positions">📂 الصفقات <span class="cnt" id="cnt-pos">0</span></div>
    <div class="tab" data-t="pending">⏳ معلّقة <span class="cnt" id="cnt-pend">0</span></div>
    <div class="tab" data-t="history">📜 السجل <span class="cnt" id="cnt-hist">0</span></div>
    <div class="tab" data-t="feed">⚡ النشاط</div>
  </div>
  <div id="t-overview">
    <div class="card">
      <div class="card-h"><div class="card-t">📈 منحنى رأس المال</div><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div class="eq-ranges" id="eq-ranges"><button data-r="1D">يوم</button><button data-r="1W">أسبوع</button><button data-r="1M">شهر</button><button data-r="3M">3 أشهر</button><button class="on" data-r="ALL">الكل</button></div><span class="eq-ret mono" id="eq-ret"></span></div></div>
      <div class="card-b">
        <div class="eq-val" id="eq-val">$10,000</div>
        <div class="eq-wrap" id="eq-wrap" style="position:relative;cursor:crosshair">
          <svg class="eq-svg" id="eq-svg" viewBox="0 0 800 220" preserveAspectRatio="none"></svg>
          <div class="eq-crosshair" id="eq-cross"></div>
          <div class="eq-dot" id="eq-dot"></div>
          <div class="eq-tooltip" id="eq-tip"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><div class="card-t">💓 نبض الأداء</div><span class="mono" style="font-size:10px;color:var(--text3)" id="hb-info"></span></div>
      <div class="card-b"><div class="hb" id="hb"></div></div>
    </div>
    <div class="card">
      <div class="card-h"><div class="card-t">📂 صفقات مفتوحة</div></div>
      <div class="card-b"><div class="pos-grid" id="pos-overview"></div></div>
    </div>
    <div class="card">
      <div class="card-h"><div class="card-t">🕑 آخر الصفقات</div></div>
      <div class="card-b" id="recent"></div>
    </div>
  </div>
  <div id="t-positions" class="hidden"><div class="card"><div class="card-b"><div class="pos-grid" id="pos-full"></div></div></div></div>
  <div id="t-pending" class="hidden"><div class="card"><div class="card-h"><div class="card-t">⏳ أوامر معلّقة (Limit @ entry1)</div></div><div class="card-b" id="pend-list"></div></div></div>
  <div id="t-history" class="hidden"><div class="card"><div class="card-b" id="hist-list"></div></div></div>
  <div id="t-feed" class="hidden"><div class="card"><div class="card-b" id="feed-list"></div></div></div>
</div>
<div class="status">
  <div><span class="st-dot on" id="st-dot"></span> Binance API · data-api.binance.vision</div>
  <div class="mono" id="st-time">--</div>
</div>
<script>
const S_URL=()=>`./state.json?_=${Date.now()}`;
const T_URL=()=>`./trades_log.csv?_=${Date.now()}`;
let LAST={state:null,trades:[],prices:{}};
const $=s=>document.querySelector(s);
const num=x=>parseFloat(x)||0;
const money=(v,d=2)=>'$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=v=>(v>=0?'+':'')+v.toFixed(2)+'%';
const price=p=>{p=Number(p);if(!p)return'--';if(p>=1000)return p.toFixed(2);if(p>=1)return p.toFixed(4);if(p>=0.001)return p.toFixed(6);return p.toFixed(8)};
function timeAgo(t){if(!t)return'';const m=Math.floor((Date.now()-new Date(t).getTime())/60000);if(m<1)return'الآن';if(m<60)return m+'د';const h=Math.floor(m/60);if(h<24)return h+'س';return Math.floor(h/24)+'ي'}
function fmtDT(t){if(!t)return'';try{return new Date(t).toLocaleString('ar-EG',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return String(t).slice(0,16)}}
function parseCSV(txt){
  const lines=txt.trim().split('\n').filter(l=>l.trim());
  if(!lines.length)return[];
  const COLS=['pair','signal_time','entry_price','exit_time','exit_price','pnl_pct_net','pnl_dollars','position_dollars','exit_reason','score','balance_after'];
  const first=lines[0].split(',')[0].trim().toLowerCase();
  const hasHeader=(first==='pair'||first==='symbol');
  const data=hasHeader?lines.slice(1):lines;
  const h=hasHeader?lines[0].split(',').map(x=>x.trim()):COLS;
  return data.map(l=>{const v=l.split(',');const r={};h.forEach((k,i)=>r[k]=(v[i]||'').trim());return r;});
}
async function getPrices(syms){const p={};for(const s of syms){try{const r=await fetch(`https://data-api.binance.vision/api/v3/ticker/price?symbol=${encodeURIComponent(s)}`);if(r.ok){const d=await r.json();p[s]=parseFloat(d.price);}}catch(e){}}return p;}

function render(){
  const{state,trades,prices}=LAST;
  if(!state)return;
  const bal=num(state.balance)||10000;
  const st=state.stats||{};
  const total=st.total_trades||0,wins=st.wins||0,losses=st.losses||0;
  const wr=total?wins/total*100:0;
  const gp=st.gross_profit||0,gl=st.gross_loss||0;
  const pf=gl>0?gp/gl:0;
  const ret=(bal-10000)/10000*100;
  const pos=state.open_positions||{};
  const pend=state.pending_setups||{};
  const posK=Object.keys(pos),pendK=Object.keys(pend);
  $('#kpis').innerHTML=`
    <div class="kpi g"><div class="kpi-label">رأس المال</div><div class="kpi-val">${money(bal,0)}</div><div class="kpi-sub ${ret>=0?'pos':'neg'}">${pct(ret)}</div></div>
    <div class="kpi b"><div class="kpi-label">الصفقات</div><div class="kpi-val">${total}</div><div class="kpi-sub">${wins}W / ${losses}L</div></div>
    <div class="kpi g"><div class="kpi-label">نسبة النجاح</div><div class="kpi-val pos">${wr.toFixed(1)}%</div><div class="kpi-sub">${wins}/${total}</div></div>
    <div class="kpi p"><div class="kpi-label">عامل الربح</div><div class="kpi-val">${pf.toFixed(2)}</div><div class="kpi-sub">PF</div></div>
    <div class="kpi a"><div class="kpi-label">مفتوحة</div><div class="kpi-val">${posK.length}</div><div class="kpi-sub">${pendK.length} معلّقة</div></div>
    <div class="kpi g"><div class="kpi-label">ربح اليوم</div><div class="kpi-val pos">${money(todayPnl(trades),0)}</div><div class="kpi-sub">24h</div></div>`;
  $('#eq-val').textContent=money(bal);
  $('#eq-ret').textContent=pct(ret);
  $('#eq-ret').className='eq-ret mono '+(ret>=0?'pos':'neg');
  drawEquity(trades);
  drawHeartbeat(trades,posK.length);
  $('#cnt-pos').textContent=posK.length;
  $('#cnt-pend').textContent=pendK.length;
  $('#cnt-hist').textContent=trades.length;
  const posHtml=posK.length?posK.map(s=>posCard(s,pos[s],prices[s])).join(''):'<div class="empty">📭 لا صفقات مفتوحة</div>';
  $('#pos-overview').innerHTML=posHtml;
  $('#pos-full').innerHTML=posHtml;
  $('#pend-list').innerHTML=pendK.length?pendK.map(s=>{const p=pend[s];return`<div class="pend-row"><div><span class="pend-sym">${s}</span><div class="pend-info">Entry: ${price(num(p.entry1))} | SL: ${price(num(p.sl))} | TP: ${price(num(p.tp))}</div></div><div class="pend-info">${timeAgo(p.signal_time)}</div></div>`;}).join(''):'<div class="empty">لا أوامر معلّقة</div>';
  const recent=trades.slice(-8).reverse();
  $('#recent').innerHTML=recent.length?recent.map(tradeRow).join(''):'<div class="empty">لا صفقات</div>';
  $('#hist-list').innerHTML=trades.slice().reverse().map(tradeRow).join('')||'<div class="empty">لا سجل</div>';
  const hist=state.signal_history||[];
  $('#feed-list').innerHTML=hist.length?hist.slice(0,30).map(h=>{const k=h.kind||'';const dot=k.includes('خروج')?(h.detail||'').includes('-')?'r':'g':k.includes('إشارة')?'b':k.includes('إلغاء')?'a':'g';return`<div class="feed-item"><div class="feed-dot ${dot}"></div><div><div class="feed-text"><b>${h.symbol||''}</b> — ${h.detail||k}</div><div class="feed-time">${timeAgo(h.time)} · ${k}</div></div></div>`;}).join(''):'<div class="empty">لا نشاط</div>';
}
function todayPnl(trades){const now=Date.now(),day=86400000;return trades.filter(t=>now-new Date(t.exit_time||t.signal_time).getTime()<day).reduce((s,t)=>s+num(t.pnl_dollars),0);}
let EQ_PTS=[],EQ_TRADES=[],EQ_RANGE='ALL';
function filterByRange(trades,range){
  if(range==='ALL')return trades;
  const now=Date.now();
  const ms={'1D':86400000,'1W':604800000,'1M':2592000000,'3M':7776000000}[range]||Infinity;
  return trades.filter(t=>{const d=now-new Date(t.exit_time||t.signal_time).getTime();return d<=ms;});
}
function drawEquity(trades){
  EQ_TRADES=trades;
  const filtered=filterByRange(trades,EQ_RANGE);
  if(!filtered.length){$('#eq-svg').innerHTML='';EQ_PTS=[];return;}
  const startBal=filtered.length>0?num(filtered[0].balance_after)-num(filtered[0].pnl_dollars):10000;
  const pts=[startBal,...filtered.map(t=>num(t.balance_after)||startBal)];
  EQ_PTS=pts;
  const W=800,H=220,P=10;
  const min=Math.min(...pts),max=Math.max(...pts),rng=(max-min)||1;
  const x=i=>P+(i/(pts.length-1))*(W-2*P);
  const y=v=>H-P-((v-min)/rng)*(H-2*P);
  let path=`M${x(0)},${y(pts[0])}`;
  for(let i=1;i<pts.length;i++)path+=` L${x(i)},${y(pts[i])}`;
  const area=path+` L${x(pts.length-1)},${H} L${x(0)},${H} Z`;
  const lastUp=pts[pts.length-1]>=pts[0];
  const col=lastUp?'var(--green)':'var(--red)';
  $('#eq-svg').innerHTML=`<defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity=".15"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#eg)"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1])}" r="4" fill="${col}"><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle>`;
  window._eqChart={pts,x,y,W,H,P,min,max,rng,filtered,startBal,col};
}
// Range buttons
document.querySelectorAll('#eq-ranges button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#eq-ranges button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    EQ_RANGE=btn.dataset.r;
    drawEquity(EQ_TRADES);
  });
});
// Interactive tooltip
(function(){
  const wrap=document.getElementById('eq-wrap');
  if(!wrap)return;
  const cross=document.getElementById('eq-cross');
  const dot=document.getElementById('eq-dot');
  const tip=document.getElementById('eq-tip');
  function handleMove(e){
    const c=window._eqChart;if(!c||!c.pts.length)return;
    const rect=wrap.getBoundingClientRect();
    const cx=e.clientX!==undefined?e.clientX:(e.touches&&e.touches[0]?e.touches[0].clientX:0);
    const mx=cx-rect.left;
    const relX=mx/rect.width;
    const idx=Math.max(0,Math.min(c.pts.length-1,Math.round(relX*(c.pts.length-1))));
    const val=c.pts[idx];
    const pctVal=((val-c.startBal)/c.startBal*100);
    const svgX=c.x(idx)/c.W*rect.width;
    const svgY=c.y(val)/c.H*rect.height;
    cross.style.left=svgX+'px';cross.classList.add('show');
    dot.style.left=svgX+'px';dot.style.top=svgY+'px';dot.style.borderColor=c.col;dot.classList.add('show');
    const trade=c.filtered[idx-1];
    const sym=trade?(trade.pair||trade.symbol):'';
    const time=trade?fmtDT(trade.exit_time):'';
    const reason=trade?(trade.exit_reason||''):'';
    tip.innerHTML=`<div style="font-weight:700;font-size:13px;margin-bottom:2px">${money(val)}</div><div class="${pctVal>=0?'pos':'neg'}" style="font-weight:700;font-size:12px">${pct(pctVal)}</div>${sym?`<div style="color:var(--text2);margin-top:4px;font-size:10px">${sym} · ${reason}</div><div style="color:var(--text3);font-size:9px">${time}</div>`:''}`;
    tip.classList.add('show');
    let tipX=svgX+14;if(tipX+150>rect.width)tipX=svgX-160;
    tip.style.left=Math.max(0,tipX)+'px';tip.style.top=Math.max(0,svgY-70)+'px';
  }
  function handleLeave(){cross.classList.remove('show');dot.classList.remove('show');tip.classList.remove('show');}
  wrap.addEventListener('mousemove',handleMove);
  wrap.addEventListener('touchmove',e=>{e.preventDefault();handleMove(e);},{passive:false});
  wrap.addEventListener('mouseleave',handleLeave);
  wrap.addEventListener('touchend',handleLeave);
})();
function drawHeartbeat(trades,openCount){
  const recent=trades.slice(-60);
  let html=recent.map(t=>{
    const r=(t.exit_reason||'').toLowerCase();
    let cls='to',h=18;
    if(r.includes('tp')){cls='tp';h=30;}
    else if(r.includes('trail')){cls='trail';h=26;}
    else if(r.includes('sl')){cls='sl';h=12;}
    else{cls='to';h=16;}
    const pnl=num(t.pnl_dollars);
    h=Math.max(8,Math.min(38,h+Math.abs(pnl)/40));
    return`<div class="hb-bar ${cls}" style="height:${h}px" title="${t.pair||''} ${pnl>=0?'+':''}${money(pnl)} | ${t.exit_reason||''}"></div>`;
  }).join('');
  for(let i=0;i<openCount;i++)html+=`<div class="hb-bar open"></div>`;
  $('#hb').innerHTML=html||'<span style="font-size:11px;color:var(--text3)">لا بيانات</span>';
  const w=recent.filter(t=>num(t.pnl_dollars)>0).length;
  $('#hb-info').textContent=`${recent.length} صفقة | ${w} رابحة`;
}
function posCard(sym,p,curPrice){
  const entry=num(p.entry_price),sl=num(p.sl),tp=num(p.tp);
  const cur=curPrice||entry;
  const pnlPct=((cur-entry)/entry)*100;
  const up=pnlPct>=0;
  const lo=Math.min(sl,entry,tp,cur)*0.998;
  const hi=Math.max(sl,entry,tp,cur)*1.002;
  const rng=hi-lo||1;
  const pctPos=v=>((v-lo)/rng*100).toFixed(1);
  const entryP=pctPos(entry),slP=pctPos(sl),tpP=pctPos(tp),curP=pctPos(cur);
  const fillL=Math.min(parseFloat(entryP),parseFloat(curP));
  const fillW=Math.abs(parseFloat(curP)-parseFloat(entryP));
  return`<div class="pos-card">
    <div class="pos-top"><span class="pos-sym">${sym}</span><span class="pos-tag">LIMIT</span></div>
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px">
      <span class="mono ${up?'pos':'neg'}" style="font-size:18px;font-weight:700">${pct(pnlPct)}</span>
      <span style="font-size:10px;color:var(--text3)">${timeAgo(p.entry_time)}</span>
    </div>
    <div class="range-bar">
      <div class="range-fill ${up?'profit':'loss'}" style="left:${fillL}%;width:${Math.max(fillW,1)}%"></div>
      <div class="range-marker sl" style="left:${slP}%"><span class="range-label" style="color:var(--red)">SL</span></div>
      <div class="range-marker entry" style="left:${entryP}%"><span class="range-label" style="color:var(--blue)">Entry</span></div>
      <div class="range-marker tp" style="left:${tpP}%"><span class="range-label" style="color:var(--green)">TP</span></div>
      <div class="range-marker current" style="left:${curP}%"><span class="range-label" style="color:#fff">Now</span></div>
    </div>
    <div class="pos-info">
      <div class="pos-i"><div class="l">دخول</div><div class="v">${price(entry)}</div></div>
      <div class="pos-i"><div class="l">حالي</div><div class="v ${up?'pos':'neg'}">${price(cur)}</div></div>
      <div class="pos-i"><div class="l">هدف</div><div class="v pos">${price(tp)}</div></div>
      <div class="pos-i"><div class="l">وقف</div><div class="v neg">${price(sl)}</div></div>
      <div class="pos-i"><div class="l">Score</div><div class="v">${p.score?num(p.score).toFixed(2):'--'}</div></div>
      <div class="pos-i"><div class="l">حجم</div><div class="v">${p.position_dollars?money(num(p.position_dollars),0):'--'}</div></div>
    </div>
  </div>`;
}
function tradeRow(t){
  const w=num(t.pnl_dollars)>=0;
  const r=(t.exit_reason||'');
  const ic=r.includes('TP')||r.includes('Trail')?'🎯':r.includes('SL')?'🛑':'⏱️';
  return`<div class="tr-row">
    <div class="tr-ic ${w?'w':'l'}">${ic}</div>
    <div><div class="tr-sym">${t.pair||t.symbol||''}</div><div class="tr-meta">${fmtDT(t.exit_time)} · ${r} · ${t.score?'S:'+num(t.score).toFixed(2):''}</div></div>
    <div class="tr-pnl"><div class="v ${w?'pos':'neg'}">${w?'+':''}${money(num(t.pnl_dollars))}</div><div class="p ${w?'pos':'neg'}">${pct(num(t.pnl_pct_net||0))}</div></div>
  </div>`;
}
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    const t=btn.dataset.t;
    ['overview','positions','pending','history','feed'].forEach(id=>{const el=$(`#t-${id}`);if(el)el.classList.toggle('hidden',id!==t);});
  });
});
async function load(){
  try{
    const[sR,tR]=await Promise.allSettled([
      fetch(S_URL()).then(r=>{if(!r.ok)throw 0;return r.json()}),
      fetch(T_URL()).then(r=>{if(!r.ok)throw 0;return r.text()})
    ]);
    const state=sR.status==='fulfilled'?sR.value:null;
    const trades=tR.status==='fulfilled'?parseCSV(tR.value):[];
    let prices={};
    if(state&&state.open_positions){const syms=Object.keys(state.open_positions);if(syms.length)prices=await getPrices(syms);}
    if(!state&&!trades.length)return;
    LAST={state,trades,prices};
    render();
    $('#st-dot').className='st-dot on';
    $('#upd').textContent=new Date().toLocaleTimeString('en-GB');
    $('#st-time').textContent=new Date().toLocaleTimeString('en-GB');
  }catch(e){$('#st-dot').className='st-dot off';}
}
load();
setInterval(load,15000);
</script>
