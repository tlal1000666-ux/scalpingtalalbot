<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scalping Talal Bot · Trading Terminal</title>

    <!-- ==================== ALL CSS ==================== -->
    <style>
        /* ----- Tailwind base + custom theme (from index.css) ----- */
        @import "tailwindcss";

        @theme {
            --font-mono: "JetBrains Mono", ui-monospace, monospace;
            --font-sans: "Inter", "IBM Plex Sans Arabic", sans-serif;

            --color-bg: #060a09;
            --color-bg-2: #0a0f0e;
            --color-panel: #0e1513;
            --color-panel-2: #121b18;
            --color-line: #1c2823;
            --color-line-soft: #16211d;

            --color-ink: #e7f2ec;
            --color-dim: #7d938a;
            --color-faint: #4d5f57;

            --color-neon: #3ddc84;
            --color-neon-dim: #123322;
            --color-loss: #ff5c5c;
            --color-loss-dim: #3a1c1c;
            --color-warn: #f0b849;
            --color-warn-dim: #3a2f16;
            --color-info: #5b8def;
            --color-violet: #a78bfa;
        }

        @font-face {
            font-family: "Inter";
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url("https://fonts.gstatic.com/s/inter/v18/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiJ-Ek-_EeAmM.woff2") format("woff2");
        }

        @font-face {
            font-family: "JetBrains Mono";
            font-style: normal;
            font-weight: 400 700;
            font-display: swap;
            src: url("https://fonts.gstatic.com/s/jetbrainsmono/v24/tDba2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKxjPVmUsaaDhw.woff2") format("woff2");
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        #root {
            min-height: 100vh;
            background: var(--color-bg);
            color: var(--color-ink);
            font-family: var(--font-sans);
        }

        body {
            margin: 0;
            background-image:
                radial-gradient(circle at 12% -5%, rgba(61, 220, 132, 0.06), transparent 42%),
                radial-gradient(circle at 92% 8%, rgba(91, 141, 239, 0.05), transparent 40%),
                radial-gradient(circle at 80% 100%, rgba(167, 139, 250, 0.04), transparent 45%);
        }

        ::-webkit-scrollbar {
            height: 7px;
            width: 7px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-line);
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2a3a33;
        }

        .mono {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }

        .glass {
            background: linear-gradient(160deg, rgba(18, 27, 24, 0.9), rgba(10, 15, 14, 0.75));
            backdrop-filter: blur(12px);
            border: 1px solid var(--color-line);
        }

        .glow-neon {
            box-shadow: 0 0 0 1px rgba(61, 220, 132, 0.25), 0 0 24px -6px rgba(61, 220, 132, 0.4);
        }

        .text-glow-neon {
            text-shadow: 0 0 14px rgba(61, 220, 132, 0.45);
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.35;
                transform: scale(0.85);
            }
        }
        .pulse-dot {
            animation: pulse-dot 1.6s ease-in-out infinite;
        }

        @keyframes ping-ring {
            0% {
                transform: scale(0.8);
                opacity: 0.7;
            }
            80%,
            100% {
                transform: scale(2.4);
                opacity: 0;
            }
        }
        .ping-ring {
            animation: ping-ring 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .slide-in {
            animation: slide-in 0.35s ease-out both;
        }

        @keyframes shimmer {
            0% {
                background-position: -400px 0;
            }
            100% {
                background-position: 400px 0;
            }
        }
        .skeleton {
            background: linear-gradient(90deg, #121b18 25%, #1a2621 37%, #121b18 63%);
            background-size: 800px 100%;
            animation: shimmer 1.4s infinite linear;
        }

        @keyframes flash-green {
            0% {
                background-color: rgba(61, 220, 132, 0.22);
            }
            100% {
                background-color: transparent;
            }
        }
        .flash-green {
            animation: flash-green 0.8s ease-out;
        }

        @keyframes flash-red {
            0% {
                background-color: rgba(255, 92, 92, 0.22);
            }
            100% {
                background-color: transparent;
            }
        }
        .flash-red {
            animation: flash-red 0.8s ease-out;
        }

        @keyframes marquee-scan {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ----- Additional custom styles for the app ----- */
        .stat-card {
            background: rgba(14, 21, 19, 0.7);
            border: 1px solid var(--color-line);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            transition: border-color 0.2s;
        }
        .stat-card:hover {
            border-color: #2a3f36;
        }

        .badge-neon {
            background: var(--color-neon-dim);
            color: var(--color-neon);
            padding: 0.1rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            border: 1px solid rgba(61, 220, 132, 0.2);
        }

        .badge-loss {
            background: var(--color-loss-dim);
            color: var(--color-loss);
            padding: 0.1rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            border: 1px solid rgba(255, 92, 92, 0.2);
        }

        .badge-warn {
            background: var(--color-warn-dim);
            color: var(--color-warn);
            padding: 0.1rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            border: 1px solid rgba(240, 184, 73, 0.2);
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0.9rem;
            border-radius: 8px;
            color: var(--color-dim);
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.15s;
            cursor: pointer;
            text-decoration: none;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .nav-link:hover {
            color: var(--color-ink);
            background: rgba(28, 40, 35, 0.5);
        }
        .nav-link.active {
            color: var(--color-neon);
            background: rgba(61, 220, 132, 0.08);
            border: 1px solid rgba(61, 220, 132, 0.15);
        }
        .nav-link .icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .grid-panel {
            display: grid;
            gap: 1rem;
        }

        .mini-chart {
            height: 52px;
            width: 100%;
            display: flex;
            align-items: flex-end;
            gap: 1px;
        }
        .mini-chart .bar {
            flex: 1;
            border-radius: 1px 1px 0 0;
            min-height: 2px;
            transition: height 0.3s;
        }

        .candle-chart {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 80px;
            width: 100%;
        }
        .candle-chart .candle {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            position: relative;
        }
        .candle-chart .candle .wick {
            width: 1px;
            background: var(--color-dim);
            flex: 1;
            min-height: 2px;
        }
        .candle-chart .candle .body {
            width: 100%;
            min-height: 2px;
            border-radius: 1px;
            flex-shrink: 0;
        }
        .candle-chart .candle .body.green {
            background: var(--color-neon);
        }
        .candle-chart .candle .body.red {
            background: var(--color-loss);
        }

        .signal-pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-neon);
            animation: pulse-dot 1.6s ease-in-out infinite;
        }
        .signal-pulse.buy {
            background: var(--color-neon);
        }
        .signal-pulse.sell {
            background: var(--color-loss);
        }
        .signal-pulse.neutral {
            background: var(--color-warn);
        }

        .activity-ticker {
            overflow: hidden;
            position: relative;
            height: 28px;
        }
        .activity-ticker .ticker-track {
            display: flex;
            animation: marquee-scan 28s linear infinite;
            width: max-content;
        }
        .activity-ticker .ticker-item {
            padding: 0 2rem;
            white-space: nowrap;
            font-size: 0.8rem;
            color: var(--color-dim);
        }
        .activity-ticker .ticker-item .highlight {
            color: var(--color-ink);
        }

        @media (max-width: 768px) {
            .hide-mobile {
                display: none !important;
            }
            .stat-card {
                padding: 0.75rem;
            }
        }
    </style>

<body>
    <div id="root"></div>

    <!-- ==================== ALL APPLICATION CODE ==================== -->
    <script type="module">
        // ----- 1. IMPORTS -----
        import React, { useState, useEffect, useMemo, useRef, useCallback } from "react";
        import { createRoot } from "react-dom/client";
        import { clsx } from "clsx";
        import { twMerge } from "tailwind-merge";
        import {
            LayoutDashboard, Activity, Wallet, History, BarChart3, TrendingUp,
            ShieldAlert, Cpu, Radar, Zap, Rss, HeartPulse, Bell, Settings,
            ArrowUp, ArrowDown, Minus, ChevronRight, ChevronDown, X, Circle,
            Clock, AlertCircle, CheckCircle, Loader2, Eye, TrendingUp as TrendUp,
            TrendingDown as TrendDown, MoreVertical, RefreshCw
        } from "lucide-react";

        // ----- 2. UTILITIES (cn, format) -----
        function cn(...inputs) { return twMerge(clsx(inputs)); }

        function usd(n, digits = 2) {
            const sign = n < 0 ? "-" : "";
            const v = Math.abs(n);
            return `${sign}$${v.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits })}`;
        }
        function usdSigned(n, digits = 2) {
            const sign = n > 0 ? "+" : n < 0 ? "-" : "";
            return `${sign}$${Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits })}`;
        }
        function pct(n, digits = 2) {
            const sign = n > 0 ? "+" : "";
            return `${sign}${n.toFixed(digits)}%`;
        }
        function num(n, digits = 2) { return n.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
        function price(n) {
            if (n >= 100) return n.toFixed(2);
            if (n >= 1) return n.toFixed(4);
            return n.toFixed(5);
        }
        function compact(n) {
            if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2) + "B";
            if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + "M";
            if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(1) + "K";
            return n.toFixed(0);
        }
        function timeAgo(ts) {
            const s = Math.floor((Date.now() - ts) / 1000);
            if (s < 5) return "just now";
            if (s < 60) return `${s}s ago`;
            const m = Math.floor(s / 60);
            if (m < 60) return `${m}m ago`;
            const h = Math.floor(m / 60);
            if (h < 24) return `${h}h ago`;
            const d = Math.floor(h / 24);
            return `${d}d ago`;
        }
        function clock(ts) { return new Date(ts).toLocaleTimeString("en-US", { hour12: false }); }
        function dateTime(ts) {
            const d = new Date(ts);
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            const hh = String(d.getHours()).padStart(2, "0");
            const mi = String(d.getMinutes()).padStart(2, "0");
            return `${mm}-${dd} ${hh}:${mi}`;
        }
        function duration(min) {
            const h = Math.floor(min / 60);
            const m = Math.round(min % 60);
            if (h === 0) return `${m}m`;
            return `${String(h).padStart(2, "0")}h ${String(m).padStart(2, "0")}m`;
        }
        function durationFrom(ts) {
            const min = (Date.now() - ts) / 60000;
            const h = Math.floor(min / 60);
            const m = Math.floor(min % 60);
            const s = Math.floor((min * 60) % 60);
            return `${String(h).padStart(2, "0")}h ${String(m).padStart(2, "0")}m ${String(s).padStart(2, "0")}s`;
        }

        // ----- 3. TYPES (from types.ts) -----
        // (using JSDoc comments for clarity, but we keep as plain JS objects)
        // We'll define everything as plain JS with type hints via JSDoc

        // ----- 4. NAVIGATION (from nav.ts) -----
        const NAV = [
            { id: "overview", label: "Overview", icon: LayoutDashboard, group: "Trading" },
            { id: "live", label: "Live Trading", icon: Activity, group: "Trading" },
            { id: "positions", label: "Open Positions", icon: Wallet, group: "Trading" },
            { id: "history", label: "Trade History", icon: History, group: "Trading" },
            { id: "analytics", label: "Analytics", icon: BarChart3, group: "Insights" },
            { id: "performance", label: "Performance", icon: TrendingUp, group: "Insights" },
            { id: "risk", label: "Risk Management", icon: ShieldAlert, group: "Insights" },
            { id: "strategy", label: "Strategy Monitor", icon: Cpu, group: "Insights" },
            { id: "scanner", label: "Market Scanner", icon: Radar, group: "Signals" },
            { id: "signals", label: "Signals", icon: Zap, group: "Signals" },
            { id: "activity", label: "Bot Activity", icon: Rss, group: "System" },
            { id: "health", label: "System Health", icon: HeartPulse, group: "System" },
            { id: "alerts", label: "Alerts", icon: Bell, group: "System" },
            { id: "settings", label: "Settings", icon: Settings, group: "System" },
        ];
        const MOBILE_NAV = ["overview", "positions", "activity", "scanner", "alerts"];

        // ----- 5. MOCK DATA (from mock.ts) -----
        const INITIAL_CAPITAL = 10000;
        let seed = 1337;

        function rnd() {
            seed = (seed * 1103515245 + 12345) & 0x7fffffff;
            return seed / 0x7fffffff;
        }

        function range(min, max) { return min + rnd() * (max - min); }

        function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }

        const SYMBOLS = [
            "PROMUSDT", "IOTAUSDT", "DGBUSDT", "PHAUSDT", "VANAUSDT", "FETUSDT",
            "RUNEUSDT", "INJUSDT", "SEIUSDT", "ARBUSDT", "OPUSDT", "SUIUSDT",
            "TIAUSDT", "JTOUSDT", "PYTHUSDT", "ORDIUSDT", "WLDUSDT", "RNDRUSDT"
        ];

        const BASE_PRICE = {};
        SYMBOLS.forEach(s => BASE_PRICE[s] = range(0.05, 45));

        const now = Date.now();
        const HOUR = 3600_000;
        const DAY = 24 * HOUR;

        // Trades
        function genTrades(count) {
            const trades = [];
            let t = now - count * range(1.2, 2.4) * HOUR;
            for (let i = 0; i < count; i++) {
                const symbol = pick(SYMBOLS);
                const side = rnd() > 0.15 ? "BUY" : "SELL";
                const entry = BASE_PRICE[symbol] * range(0.9, 1.1);
                const score = Math.round(range(55, 92));
                const win = rnd() < 0.62;
                const durationMin = Math.round(range(12, 360));
                const reason = win ? (rnd() < 0.8 ? "TP" : "TIMEOUT") : (rnd() < 0.7 ? "SL" : "TIMEOUT");
                const pnlPct = win ? range(0.4, 2.6) : -range(0.3, 1.8);
                const sizeUsd = range(1500, 4200);
                const pnlUsd = (pnlPct / 100) * sizeUsd;
                const tp = side === "BUY" ? entry * (1 + range(0.015, 0.04)) : entry * (1 - range(0.015, 0.04));
                const sl = side === "BUY" ? entry * (1 - range(0.012, 0.025)) : entry * (1 + range(0.012, 0.025));
                const exit = side === "BUY" ? entry * (1 + pnlPct / 100) : entry * (1 - pnlPct / 100);
                const rr = Math.abs(tp - entry) / Math.abs(sl - entry);
                t += range(0.8, 2.6) * HOUR;
                trades.push({
                    id: `T${1000 + i}`,
                    symbol,
                    side,
                    entry,
                    exit,
                    tp,
                    sl,
                    pnlPct,
                    pnlUsd,
                    roi: pnlPct,
                    reason,
                    score,
                    entryTime: t,
                    exitTime: t + durationMin * 60000,
                    durationMin,
                    sizeUsd,
                    rr
                });
            }
            return trades;
        }
        const TRADES = genTrades(180);

        // Equity
        function buildEquity(trades) {
            const sorted = [...trades].sort((a, b) => a.exitTime - b.exitTime);
            let equity = INITIAL_CAPITAL;
            let peak = equity;
            const pts = [{ t: sorted[0]?.exitTime - DAY || now - 30 * DAY, equity, drawdown: 0 }];
            for (const tr of sorted) {
                equity += tr.pnlUsd;
                peak = Math.max(peak, equity);
                const dd = ((equity - peak) / peak) * 100;
                pts.push({ t: tr.exitTime, equity, drawdown: dd });
            }
            return pts;
        }
        const EQUITY = buildEquity(TRADES);

        // Candles
        function genCandles(base, side, n = 80) {
            const out = [];
            let price = base * range(0.985, 0.995);
            let t = now - n * 5 * 60000;
            const drift = side === "BUY" ? 0.0006 : -0.0004;
            for (let i = 0; i < n; i++) {
                const o = price;
                const move = (rnd() - 0.5) * 0.012 + drift;
                const c = o * (1 + move);
                const h = Math.max(o, c) * (1 + rnd() * 0.005);
                const l = Math.min(o, c) * (1 - rnd() * 0.005);
                out.push({ t, o, h, l, c, v: range(1e5, 9e5) });
                price = c;
                t += 5 * 60000;
            }
            return out;
        }

        // Positions
        function genPositions(count) {
            const chosen = [...SYMBOLS].sort(() => rnd() - 0.5).slice(0, count);
            return chosen.map((symbol, i) => {
                const side = rnd() > 0.2 ? "BUY" : "SELL";
                const entry = BASE_PRICE[symbol];
                const candles = genCandles(entry, side);
                const current = candles[candles.length - 1].c;
                const tp = side === "BUY" ? entry * (1 + range(0.02, 0.045)) : entry * (1 - range(0.02, 0.045));
                const sl = side === "BUY" ? entry * (1 - range(0.015, 0.03)) : entry * (1 + range(0.015, 0.03));
                const sizeUsd = range(2000, 4200);
                return {
                    id: `P${i}`,
                    symbol,
                    side,
                    entry,
                    current,
                    tp,
                    sl,
                    score: Math.round(range(58, 90)),
                    sizeUsd,
                    qty: sizeUsd / entry,
                    openTime: now - range(0.3, 8) * HOUR,
                    candles
                };
            });
        }
        const POSITIONS = genPositions(5);

        // Signals
        function genSignals(count = 12) {
            const statuses = ["New", "Waiting", "Triggered", "Opened", "TP Hit", "SL Hit", "Expired"];
            return Array.from({ length: count }, (_, i) => {
                const symbol = pick(SYMBOLS);
                const side = rnd() > 0.2 ? "BUY" : "SELL";
                const entry = BASE_PRICE[symbol] * range(0.98, 1.02);
                const tp = side === "BUY" ? entry * (1 + range(0.02, 0.045)) : entry * (1 - range(0.02, 0.045));
                const sl = side === "BUY" ? entry * (1 - range(0.015, 0.03)) : entry * (1 + range(0.015, 0.03));
                return {
                    id: `S${i}`,
                    symbol,
                    side,
                    score: Math.round(range(55, 94)),
                    entry,
                    tp,
                    sl,
                    rr: Math.abs(tp - entry) / Math.abs(sl - entry),
                    time: now - range(0.05, 6) * HOUR,
                    status: pick(statuses)
                };
            }).sort((a, b) => b.time - a.time);
        }
        const SIGNALS = genSignals(14);

        // Scanner
        function genScanner() {
            return SYMBOLS.map((symbol) => {
                const score = Math.round(range(20, 95));
                const signal = score > 72 ? "BUY" : score < 35 ? "SELL" : "NEUTRAL";
                return {
                    symbol,
                    price: BASE_PRICE[symbol],
                    change24h: range(-9, 12),
                    volume: range(5e6, 4e8),
                    signal,
                    score,
                    trend: score > 60 ? "UP" : score < 40 ? "DOWN" : "FLAT",
                    rsi: range(22, 82),
                    macd: range(-0.5, 0.6),
                    ema: rnd() > 0.5 ? "ABOVE" : "BELOW",
                    volatility: range(0.8, 6.5),
                    status: score > 78 ? "Signal" : rnd() > 0.7 ? "In Trade" : "Watching"
                };
            });
        }
        const SCANNER = genScanner();

        // Activity
        function genActivity(n = 14) {
            const templates = [
                { type: "signal", msg: "New signal detected" },
                { type: "open", msg: "Position opened" },
                { type: "price", msg: "Price updated" },
                { type: "tp", msg: "Take profit hit" },
                { type: "sl", msg: "Stop loss hit" },
                { type: "info", msg: "Market scan complete" }
            ];
            return Array.from({ length: n }, (_, i) => {
                const tpl = pick(templates);
                const symbol = pick(SYMBOLS);
                let pnl = undefined;
                let detail = "";
                if (tpl.type === "tp") { pnl = range(15, 55);

            const totalPnl = closed.reduce((s, t) => s + t.pnlUsd, 0);

            const grossLoss = Math.abs(losses.reduce((s, t) => s + t.pnlUsd, 0));
            const winRate = closed.length ? (wins.length / closed.length) * 100 : 0;
            const profitFactor = grossLoss ? grossWin / grossLoss : grossWin;
            const equity = INITIAL_CAPITAL + totalPnl;
            const avgTrade = closed.length ? totalPnl / closed.length : 0;

            const avgWin = wins.length ? grossWin / wins.length : 0;
            const avgLoss = losses.length ? grossLoss / losses.length : 0;

            const maxDd = Math.min(...eq.map(p => p.drawdown));

                                                        /td> <
                                                        td className = { `py-2 px-2 text-right ${t.pnlPct >= 0 ? 'text-neon' : 'text-loss'}` } >
                                                        { pct(t.pnlPct) } <
                                                        /td> <
                                                        td className = "py-2 px-2 text-right text-faint text-xs" > { duration(t.durationMin) } < /td> <
                                                        td className = "py-2 px-2 text-right text-xs" >
                                                        <
                                                        span className = { cn("px-2 py-0.5 rounded-full",
                                                                t.reason === "TP" ? "bg-neon/20 text-neon" :
                                                                t.reason === "SL" ? "bg-loss/20 text-loss" :
                                                                "bg-warn/20 text-warn") } >
                                                        { t.reason } <
                                                        /span> <
                                                        /td> <
                                                        /tr>
                                                    ))
                                                } <
                                                /tbody> <
                                                /table> <
                                                /div> <
                                                div className = "text-faint text-xs text-center" >
                                                Showing { Math.min(sorted.length, 50) } of { sorted.length } trades <
                                                /div> <
                                                /div>
                                            );
                                        }

                                        // Scanner
                                        function ScannerView() {
                                            return ( <
                                                    div className = "space-y-4" >
                                                    <
                                                    div className = "flex items-center justify-between" >
                                                    <
                                                    h1 className = "text-xl font-bold tracking-tight" > Market Scanner < /h1> <
                                                    span className = "text-dim text-xs" > { SCANNER.length } assets < /span> <
                                                    /div> <
                                                    div className = "overflow-x-auto" >
                                                    <
                                                    table className = "w-full text-sm" >
                                                    <
                                                    thead >
                                                    <
                                                    tr className = "text-faint border-b border-line" >
                                                    <
                                                    th className = "text-left py-2 px-2" > Symbol < /th> <
                                                    th className = "text-right py-2 px-2" > Price < /th> <
                                                    th className = "text-right py-2 px-2" > 24h % < /th> <
                                                    th className = "text-right py-2 px-2" > Volume < /th> <
                                                    th className = "text-center py-2 px-2" > Signal < /th> <
                                                    th className = "text-right py-2 px-2" > Score < /th> <
                                                    th className = "text-right py-2 px-2" > RSI < /th> <
                                                    th className = "text-center py-2 px-2" > Status < /th> <
                                                    /tr> <
                                                    /thead> <
                                                    tbody > {
                                                        SCANNER.map(row => {
                                                            const isBuy = row.signal === "BUY";
                                                            const isSell = row.signal === "SELL";
                                                            const isNeutral = row.signal === "NEUTRAL";
                                                            const statusColor = row.status === "Signal" ? "bg-neon/20 text-neon" :
                                                                row.status === "In Trade" ? "bg-warn/20 text-warn" :
                                                                "bg-faint/20 text-faint";
                                                            return ( <
                                                                tr key = { row.symbol }
                                                                className = "border-b border-line/30 hover:bg-panel-2/50 transition" >
                                                                <
                                                                td className = "py-2 px-2 font-medium" > { row.symbol } < /td> <
                                                                td className = "py-2 px-2 text-right font-mono" > { price(row.price) } < /td> <
                                                                td className = { `py-2 px-2 text-right ${row.change24h >= 0 ? 'text-neon' : 'text-loss'}` } >
                                                                { pct(row.change24h) } <
                                                                /td> <
                                                                td className = "py-2 px-2 text-right font-mono text-dim text-xs" > { compact(row.volume) } < /td> <
                                                                td className = "py-2 px-2 text-center" >
                                                                <
                                                                span className = { cn("text-xs font-bold px-2 py-0.5 rounded-full",
                                                                        isBuy ? "bg-neon/20 text-neon" :
                                                                        isSell ? "bg-loss/20 text-loss" :
                                                                        "bg-warn/20 text-warn") } >
                                                                { row.signal } <
                                                                /span> <
                                                                /td> <
                                                                td className = "py-2 px-2 text-right font-mono" >
                                                                <
                                                                span className = { cn(row.score >= 70 ? "text-neon" :
                                                                        row.score >= 40 ? "text-warn" : "text-loss") } >
                                                                { row.score } <
                                                                /span> <
                                                                /td> <
                                                                td className = "py-2 px-2 text-right font-mono" > { row.rsi.toFixed(1) } < /td> <
                                                                td className = "py-2 px-2 text-center" >
                                                                <
                                                                span className = { cn("text-xs px-2 py-0.5 rounded-full",
                                                                        statusColor) } >
                                                                { row.status } <
                                                                /span> <
                                                                /td> <
                                                                /tr>
                                                            );
                                                        })
                                                    } <
                                                    /tbody> <
                                                    /table> <
                                                    /div> <
                                                    /div>
                                                );
                                            }

                                            // Signals
                                            function SignalsView() {
                                                return ( <
                                                        div className = "space-y-4" >
                                                        <
                                                        div className = "flex items-center justify-between" >
                                                        <
                                                        h1 className = "text-xl font-bold tracking-tight" > Signals < /h1> <
                                                        span className = "text-dim text-xs" > { SIGNALS.length } total < /span> <
                                                        /div> <
                                                        div className = "grid grid-cols-1 md:grid-cols-2 gap-3" > {
                                                            SIGNALS.map(sig => {
                                                                const isBuy = sig.side === "BUY";
                                                                const statusColors = {
                                                                    "New": "bg-neon/20 text-neon",
                                                                    "Waiting": "bg-warn/20 text-warn",
                                                                    "Triggered": "bg-info/20 text-info",
                                                                    "Opened": "bg-violet/20 text-violet",
                                                                    "TP Hit": "bg-neon/20 text-neon",
                                                                    "SL Hit": "bg-loss/20 text-loss",
                                                                    "Expired": "bg-faint/20 text-faint"
                                                                };
                                                                return ( <
                                                                    div key = { sig.id }
                                                                    className = "stat-card flex items-center justify-between" >
                                                                    <
                                                                    div className = "flex items-center gap-3" >
                                                                    <
                                                                    div className = { `w-2 h-2 rounded-full ${isBuy ? 'bg-neon' : 'bg-loss'}` } >
                                                                    < /div> <
                                                                    div >
                                                                    <
                                                                    div className = "font-bold" > { sig.symbol } < /div> <
                                                                    div className = "text-faint text-xs" >
                                                                    { sig.side } · Score { sig.score } · RR { sig.rr.toFixed(2) } <
                                                                    /div> <
                                                                    /div> <
                                                                    /div> <
                                                                    div className = "text-right" >
                                                                    <
                                                                    div className = { cn("text-xs px-2 py-0.5 rounded-full inline-block",
                                                                            statusColors[sig.status] || "bg-faint/20 text-faint") } >
                                                                    { sig.status } <
                                                                    /div> <
                                                                    div className = "text-faint text-[10px] mt-1" > { timeAgo(sig.time) } < /div> <
                                                                    /div> <
                                                                    /div>
                                                                );
                                                            })
                                                        } <
                                                        /div> <
                                                        /div>
                                                    );
                                                }

                                                // Activity
                                                function ActivityView() {
                                                    return ( <
                                                            div className = "space-y-4" >
                                                            <
                                                            div className = "flex items-center justify-between" >
                                                            <
                                                            h1 className = "text-xl font-bold tracking-tight" > Bot Activity < /h1> <
                                                            span className = "text-dim text-xs" > { ACTIVITY.length } events < /span> <
                                                            /div> <
                                                            div className = "space-y-1.5" > {
                                                                ACTIVITY.map(a => {
                                                                    const icons = {
                                                                        signal: < Zap className = "w-4 h-4 text-violet" / > ,
                                                                            open: < Wallet className = "w-4 h-4 text-neon" / > ,
                                                                            price: < TrendingUp className = "w-4 h-4 text-info" / > ,
                                                                            tp: < CheckCircle className = "w-4 h-4 text-neon" / > ,
                                                                            sl: < X className = "w-4 h-4 text-loss" / > ,
                                                                            info: < Activity className = "w-4 h-4 text-dim" / > ,
                                                                    };
                                                                    return ( <
                                                                        div key = { a.id }
                                                                        className = "flex items-center gap-3 text-sm py-2 border-b border-line/30" >
                                                                        <
                                                                        div className = "w-6 h-6 flex items-center justify-center" >
                                                                        { icons[a.type] || < Activity className = "w-4 h-4 text-dim" / > } <
                                                                        /div> <
                                                                        div className = "flex-1" >
                                                                        <
                                                                        span className = "text-faint" > { a.symbol ? a.symbol + " " : "" } < /span> { a.message } <
                                                                        span className = "text-dim text-xs ml-1" > { a.detail } < /span> <
                                                                        /div> <
                                                                        span className = "text-faint text-[10px]" > { timeAgo(a.time) } < /span> <
                                                                        /div>
                                                                    );
                                                                })
                                                            } <
                                                            /div> <
                                                            /div>
                                                        );
                                                    }

                                                    // Alerts
                                                    function AlertsView() {
                                                        const [alerts, setAlerts] = useState(ALERTS);
                                                        const unread = alerts.filter(a => !a.read).length;
                                                        const markAllRead = () => {
                                                            setAlerts(alerts.map(a => ({ ...a, read: true })));
                                                        };
                                                        return ( <
                                                                div className = "space-y-4" >
                                                                <
                                                                div className = "flex items-center justify-between" >
                                                                <
                                                                h1 className = "text-xl font-bold tracking-tight" > Alerts < /h1> <
                                                                div className = "flex items-center gap-2" >
                                                                {
                                                                    unread > 0 && ( <
                                                                        button onClick = { markAllRead }
                                                                        className = "text-xs text-dim hover:text-ink transition" >
                                                                        Mark all read <
                                                                        /button>
                                                                    )
                                                                } <
                                                                span className = "text-dim text-xs" > { unread } unread < /span> <
                                                                /div> <
                                                                /div> <
                                                                div className = "space-y-2" > {
                                                                    alerts.map(a => {
                                                                        const severityColors = {
                                                                            info: "border-info/20 bg-info/5",
                                                                            success: "border-neon/20 bg-neon/5",
                                                                            warn: "border-warn/20 bg-warn/5",
                                                                            error: "border-loss/20 bg-loss/5"
                                                                        };
                                                                        const severityDots = {
                                                                            info: "bg-info",
                                                                            success: "bg-neon",
                                                                            warn: "bg-warn",
                                                                            error: "bg-loss"
                                                                        };
                                                                        return ( <
                                                                            div key = { a.id }
                                                                            className = { cn("stat-card flex items-start gap-3 border-l-4 transition-opacity",
                                                                                    severityColors[a.severity],
                                                                                    a.read ? "opacity-60" : "") }
                                                                            style = { { borderLeftColor: `var(--color-${a.severity === 'success' ? 'neon' : a.severity === 'error' ? 'loss' : a.severity === 'warn' ? 'warn' : 'info'})` } } >
                                                                            <
                                                                            div className = { `w-2 h-2 rounded-full mt-1 ${severityDots[a.severity]}` } >
                                                                            < /div> <
                                                                            div className = "flex-1" >
                                                                            <
                                                                            div className = "font-medium text-sm" > { a.title } < /div> <
                                                                            div className = "text-dim text-xs" > { a.body } < /div> <
                                                                            /div> <
                                                                            div className = "text-faint text-[10px] whitespace-nowrap" > { timeAgo(a.time) } < /div> <
                                                                            /div>
                                                                        );
                                                                    })
                                                                } <
                                                                /div> <
                                                                /div>
                                                            );
                                                        }

                                                        // Placeholder
                                                        function PlaceholderView({ title, icon: Icon }) {
                                                            return ( <
                                                                    div className = "flex flex-col items-center justify-center h-64 text-center" >
                                                                    <
                                                                    Icon className = "w-12 h-12 text-dim/30 mb-3" / >
                                                                    <
                                                                    h2 className = "text-xl font-medium text-dim" > { title } < /h2> <
                                                                    p className = "text-faint text-sm mt-1" > Module under construction < /p> <
                                                                    /div>
                                                                );
                                                            }

                                                            // ----- 7. RENDER -----
                                                            const root = document.getElementById("root");
                                                            if (root) {
                                                                createRoot(root).render( < App / > );
                                                            } else {
                                                                console.error("Root element not found");
                                                            }
    </script>
</body>
</html>
